<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Trivia Select</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>



<body class="bg-[#F5F5F5] overflow-x-hidden flex flex-col min-h-screen items-center m-0 p-0">

    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between relative h-10 sm:h-12">


            <div class="flex items-center gap-2 sm:gap-3">


                <div class="relative md:hidden">
                    <button id="menu-btn"
                        class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                        aria-label="Abrir Menú">
                        <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                            class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                    </button>

                    <div id="menu-dropdown"
                        class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                        <a href="./home.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Home
                        </a>
                        <a href="./trivia_select.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Trivia
                        </a>
                        <a href="./camera.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Cámara
                        </a>
                        <a href="./gallery.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Galería
                        </a>
                        <a href="./teams.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Equipos
                        </a>
                    </div>
                </div>


                <a href="./game.html"
                    class="w-9 h-9 sm:w-10 sm:h-10 overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shrink-0 p-1"
                    aria-label="Ir al juego de cartas">
                    <img src="./src/assets/cards icon.png" alt="Juego de Cartas" class="w-full h-full object-contain" />
                </a>

            </div>


            <div
                class="flex items-center gap-6 sm:gap-8 md:gap-8 lg:gap-12 absolute left-1/2 -translate-x-1/2 top-0 h-full z-20">


                <a href="./trivia_select.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Trivia
                </a>


                <a href="./camera.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Cámara
                </a>


                <div class="drop-shadow-xl self-start">
                    <a href="./home.html"
                        class="w-20 h-24 sm:w-24 sm:h-28 md:w-36 md:h-44 lg:w-40 lg:h-48 bg-white flex items-center justify-center pt-1 pb-4 md:pt-3 md:pb-8 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                        aria-label="Ir al inicio">
                        <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                            class="w-15 h-15 sm:w-18 sm:h-18 md:w-28 md:h-28 lg:w-32 lg:h-32 object-contain" />
                    </a>
                </div>




                <a href="./gallery.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Galería
                </a>


                <a href="./teams.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Equipos
                </a>
            </div>


            <a href="./profile.html"
                class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-white overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shadow-md bg-white shrink-0"
                aria-label="Ir al perfil">
                <img src="./src/assets/default profile.png" alt="Perfil" class="w-full h-full object-cover" />
            </a>

        </div>
    </header>


    <main
        class="w-full flex-1 flex flex-col items-center justify-center md:justify-start px-4 pt-6 sm:pt-12 md:pt-40 lg:pt-44 pb-12 sm:pb-16">


        <h1
            class="font-['Poppins',sans-serif] text-base sm:text-lg md:text-2xl lg:text-3xl font-extrabold text-[#0A1A32] text-center mb-6 sm:mb-8 md:mb-10 tracking-wide">
            El Norte juega. ¿Tú qué tanto sabes?
        </h1>


        <div
            class="relative w-full max-w-xl sm:max-w-2xl md:max-w-3xl lg:max-w-4xl min-h-[200px] sm:min-h-[230px] md:min-h-[270px] lg:min-h-[290px] bg-white border-2 border-orange-200 border-b-[6px] border-r-[6px] md:border-b-8 md:border-r-8 border-b-orange-500 border-r-orange-500 rounded-xl sm:rounded-2xl p-6 sm:p-8 md:p-10 shadow-lg shadow-amber-400/40 flex flex-col md:flex-row justify-between items-center gap-6 mb-6 sm:mb-8 md:mb-12 transition-shadow">


            <div class="flex-1 flex flex-col justify-center text-center md:text-left pr-0 md:pr-2">
                <h2
                    class="font-['Poppins',sans-serif] font-extrabold text-black text-lg sm:text-xl md:text-2xl lg:text-3xl tracking-wide drop-shadow-md mb-2 sm:mb-3">
                    Desafío Norteño
                </h2>
                <p
                    class="font-['Poppins',sans-serif] font-normal text-slate-800 text-xs sm:text-sm md:text-base leading-relaxed">
                    Preguntas aleatorias sobre los equipos de la zona norte de México.
                </p>
            </div>


            <div class="flex flex-col items-center justify-center gap-3 sm:gap-4 shrink-0 self-center">

                <img src="./src/assets/baseball redblue.png" alt="Baseball"
                    class="w-12 sm:w-14 md:w-16 lg:w-20 h-auto object-contain drop-shadow-sm" />


                <a href="./trivia.html"
                    class="inline-block px-6 py-2.5 sm:px-7 sm:py-3 md:px-8 md:py-3.5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm md:text-base rounded-full shadow-md hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-200 text-center tracking-wide whitespace-nowrap cursor-pointer">
                    ¡Prueba ahora!
                </a>
            </div>
        </div>



        <div
            class="w-full max-w-2xl sm:max-w-3xl md:max-w-5xl lg:max-w-6xl grid grid-cols-2 md:grid-cols-3 gap-6 sm:gap-10 md:gap-14 lg:gap-20">


            <div
                class="aspect-[4/3] bg-white border-2 border-orange-200 border-b-[6px] border-r-[6px] md:border-b-8 md:border-r-8 border-b-orange-500 border-r-orange-500 rounded-xl sm:rounded-2xl p-4 sm:p-5 md:p-6 shadow-lg shadow-amber-400/35 flex flex-col items-center justify-between transition-all hover:scale-[1.02] hover:shadow-amber-400/50 cursor-pointer text-center">
                <h3
                    class="font-['Poppins',sans-serif] font-bold text-black text-sm sm:text-base md:text-xl lg:text-2xl tracking-wide drop-shadow-sm">
                    Desafío Sultán
                </h3>
                <div class="flex-1 flex items-center justify-center my-auto">
                    <img src="./src/assets/Sultanes logo.png" alt="Sultanes Logo"
                        class="w-14 sm:w-16 md:w-20 lg:w-24 h-auto object-contain drop-shadow-sm" />
                </div>
            </div>


            <div
                class="aspect-[4/3] bg-white border-2 border-orange-200 border-b-[6px] border-r-[6px] md:border-b-8 md:border-r-8 border-b-orange-500 border-r-orange-500 rounded-xl sm:rounded-2xl p-4 sm:p-5 md:p-6 shadow-lg shadow-amber-400/35 flex flex-col items-center justify-between transition-all hover:scale-[1.02] hover:shadow-amber-400/50 cursor-pointer text-center">
                <h3
                    class="font-['Poppins',sans-serif] font-bold text-black text-sm sm:text-base md:text-xl lg:text-2xl tracking-wide drop-shadow-sm">
                    Desafío Charro
                </h3>
                <div class="flex-1 flex items-center justify-center my-auto">
                    <img src="./src/assets/Charros logo.png" alt="Charros Logo"
                        class="w-14 sm:w-16 md:w-20 lg:w-24 h-auto object-contain drop-shadow-sm" />
                </div>
            </div>


            <div
                class="flex aspect-[4/3] bg-white border-2 border-orange-200 border-b-[6px] border-r-[6px] md:border-b-8 md:border-r-8 border-b-orange-500 border-r-orange-500 rounded-xl sm:rounded-2xl p-4 sm:p-5 md:p-6 shadow-lg shadow-amber-400/35 flex-col items-center justify-between transition-all hover:scale-[1.02] hover:shadow-amber-400/50 cursor-pointer text-center">
                <h3
                    class="font-['Poppins',sans-serif] font-bold text-black text-sm sm:text-base md:text-xl lg:text-2xl tracking-wide drop-shadow-sm">
                    Desafío Rielero
                </h3>
                <div class="flex-1 flex items-center justify-center my-auto">
                    <img src="./src/assets/rieleros logo.png" alt="Rieleros Logo"
                        class="w-14 sm:w-16 md:w-20 lg:w-24 h-auto object-contain drop-shadow-sm" />
                </div>
            </div>


    </main>




    <script src="./src/js/index.js"></script>

</body>

</html>
