<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Trivia Select</title>
    <!-- Google Font: Anton -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<!-- 1. Ensure body has zero margins/padding -->

<body class="bg-white flex flex-col min-h-screen items-center m-0 p-0">
    <!-- 2. Pinned to top (sticky top-0 z-30) and using shadow-xl instead of drop-shadow-xl -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- 1. LEFT: Menu Button & Dropdown -->
            <div class="relative">
                <button id="menu-btn"
                    class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                    aria-label="Abrir Menú">
                    <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                        class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                </button>
                <!-- Dropdown Menu -->
                <div id="menu-dropdown"
                    class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                    <a href="./home.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Home
                    </a>
                    <a href="./trivia_select.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Trivia
                    </a>
                    <a href="./camera.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Cámara
                    </a>
                    <a href="./gallery.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Galería
                    </a>
                    <a href="./teams.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Equipos
                    </a>
                </div>
            </div>
            <!-- CENTER: Upside-Down White Pentagon (retains drop-shadow-xl for polygon) -->
            <div class="absolute left-1/2 -translate-x-1/2 top-0 z-20 drop-shadow-xl">
                <a href="./index.html"
                    class="w-20 h-24 sm:w-22 sm:h-26 bg-white flex items-center justify-center pt-1 pb-4 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                    aria-label="Ir al inicio">
                    <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                        class="w-15 h-15 sm:w-17 sm:h-17 object-contain" />
                </a>
            </div>
            <!-- 3. RIGHT: Spacer -->
            <div class="w-10"></div>
        </div>
    </header>

    <!-- MAIN TRIVIA SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-12 sm:pt-16 pb-16">

        <!-- Title (Extra Bold) -->
        <h1
            class="font-['Poppins',sans-serif] text-base sm:text-lg md:text-xl font-extrabold text-[#0A1A32] text-center mb-6 sm:mb-8 tracking-wide">
            El Norte juega. ¿Tú qué tanto sabes?
        </h1>

        <!-- Rectangle Container (Orange-Yellow Shadow) -->
        <div
            class="relative w-full max-w-2xl sm:max-w-3xl h-40 sm:h-48 bg-white border border-orange-200 border-b-6 border-b-orange-500 rounded-xl sm:rounded-2xl p-5 shadow-lg shadow-amber-400/40 flex flex-col justify-end items-end mb-6 sm:mb-8 transition-shadow">
            <!-- Red "¡Prueba ahora!" Button (Bottom Right) -->
            <a href="./trivia.html"
                class="inline-block px-6 py-2 sm:px-7 sm:py-2.5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-200 text-center tracking-wide whitespace-nowrap cursor-pointer">
                ¡Prueba ahora!
            </a>
        </div>
        <!-- 2x2 Square Containers Grid -->
        <div class="w-full max-w-2xl sm:max-w-3xl grid grid-cols-2 gap-4 sm:gap-6">
            <!-- Square 1 -->
            <div
                class="aspect-square bg-white border border-orange-200 border-b-5 border-b-orange-500 rounded-xl sm:rounded-2xl p-4 shadow-lg shadow-amber-400/35 flex flex-col items-center justify-center transition-all hover:scale-[1.02] hover:shadow-amber-400/50">
            </div>
            <!-- Square 2 -->
            <div
                class="aspect-square bg-white border border-orange-200 border-b-5 border-b-orange-500 rounded-xl sm:rounded-2xl p-4 shadow-lg shadow-amber-400/35 flex flex-col items-center justify-center transition-all hover:scale-[1.02] hover:shadow-amber-400/50">
            </div>
            <!-- Square 3 -->
            <div
                class="aspect-square bg-white border border-orange-200 border-b-5 border-b-orange-500 rounded-xl sm:rounded-2xl p-4 shadow-lg shadow-amber-400/35 flex flex-col items-center justify-center transition-all hover:scale-[1.02] hover:shadow-amber-400/50">
            </div>
            <!-- Square 4 -->
            <div
                class="aspect-square bg-white border border-orange-200 border-b-5 border-b-orange-500 rounded-xl sm:rounded-2xl p-4 shadow-lg shadow-amber-400/35 flex flex-col items-center justify-center transition-all hover:scale-[1.02] hover:shadow-amber-400/50">
            </div>
        </div>

    </main>



    <script src="./src/js/index.js"></script>

</body>

</html>
