<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Perfil</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./src/assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./src/assets/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="./src/assets/favicon_io/favicon.ico">
    <link rel="manifest" href="./src/assets/favicon_io/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body
    class="bg-[#0A1A32] overflow-x-hidden flex flex-col min-h-screen items-center justify-between m-0 p-0 relative font-['Poppins',sans-serif]">

    <!-- Encabezado con Regresar, Cerrar Sesión y Cámara -->
    <header class="w-full bg-transparent px-4 sm:px-6 py-4 absolute top-0 left-0 z-30">
        <div class="max-w-7xl mx-auto flex items-center justify-between">

            <a href="./home.html"
                class="inline-flex items-center gap-1.5 text-white/90 hover:text-white font-medium text-xs sm:text-sm py-1.5 px-3 rounded-lg hover:bg-white/10 transition-colors"
                aria-label="Regresar al inicio">
                <span>← Regresar</span>
            </a>

            <div class="flex items-center gap-2 sm:gap-3">
                <button id="profile-logout-btn" type="button"
                    class="text-white/80 hover:text-red-300 font-medium text-xs sm:text-sm py-1.5 px-3 rounded-lg hover:bg-white/10 transition-colors cursor-pointer"
                    title="Cerrar sesión actual">
                    Cerrar sesión
                </button>

                <a href="./camera.html"
                    class="flex items-center justify-center p-2 rounded-full hover:bg-white/10 transition-all cursor-pointer"
                    aria-label="Abrir cámara">
                    <img src="./src/assets/camera.png" alt="Cámara"
                        class="w-6 h-6 sm:w-7 sm:h-7 object-contain brightness-0 invert" />
                </a>
            </div>

        </div>
    </header>

    <!-- Información Superior del Usuario -->
    <div class="w-full flex-1 flex flex-col items-center justify-center pt-20 pb-6 px-4 z-10 shrink-0">

        <div
            class="w-28 h-28 sm:w-32 sm:h-32 md:w-36 md:h-36 rounded-full border-4 border-white shadow-2xl overflow-hidden bg-white flex items-center justify-center transition-transform hover:scale-105">
            <img id="profile-avatar" src="./src/assets/default profile.png" alt="Foto de perfil" class="w-full h-full object-cover" />
        </div>

        <h1 id="profile-name"
            class="text-white font-['Poppins',sans-serif] font-bold text-xl sm:text-2xl mt-3 tracking-wide drop-shadow-sm text-center">
            Cargando...
        </h1>

        <p id="profile-email" class="text-white/70 text-xs sm:text-sm mt-0.5 font-normal text-center">
        </p>

        <!-- Badge de equipo favorito -->
        <div id="profile-badge-container" class="flex items-center justify-center">
        </div>

    </div>

    <!-- Contenedor Inferior: Acciones y Coleccionables (Optimizado para Celular y Computadora) -->
    <div
        class="w-full flex-1 min-h-[380px] lg:min-h-[420px] bg-[#F5F5F5] rounded-t-[2.5rem] shadow-2xl px-4 py-6 sm:px-8 sm:py-8 flex flex-col items-center justify-start z-20">

        <!-- Botón Editar Perfil -->
        <div class="flex items-center justify-center gap-3 mb-5 sm:mb-6">
            <a href="./edit_profile.html"
                class="inline-block px-7 py-2 sm:px-9 sm:py-2.5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer tracking-wide text-center">
                Editar perfil
            </a>
        </div>

        <!-- Encabezado de la Sección de Coleccionables -->
        <div class="w-full max-w-md sm:max-w-2xl md:max-w-4xl lg:max-w-6xl xl:max-w-7xl 2xl:max-w-[1500px] flex items-center justify-between mb-6 sm:mb-8 px-3">
            <h2 class="text-base sm:text-lg md:text-xl font-bold uppercase tracking-wider text-slate-700 flex items-center gap-2.5">
                <img src="./src/assets/cards icon.png" alt="Cartas" class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                Mis Coleccionables
            </h2>
            <span class="text-xs sm:text-sm text-slate-400 font-medium">Zona Norte</span>
        </div>

        <!-- Cuadrícula de Coleccionables con tamaños grandes y vistosos en PC y ordenado en móvil -->
        <div id="collectibles-container"
            class="w-full max-w-md sm:max-w-2xl md:max-w-4xl lg:max-w-6xl xl:max-w-7xl 2xl:max-w-[1500px] grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 md:gap-10 lg:gap-12 justify-items-center items-center pb-14">
        </div>

    </div>

    <!-- Modal para ver coleccionable en grande -->
    <div id="collectible-modal" 
        class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 transition-opacity duration-300 opacity-0 pointer-events-none select-none">
        
        <!-- Tarjeta interior modal -->
        <div id="collectible-modal-content" 
            class="relative max-w-lg sm:max-w-xl md:max-w-2xl w-full max-h-[92vh] overflow-y-auto bg-[#003049] border-2 border-[#FCBF49] rounded-3xl shadow-[0_25px_60px_rgba(0,0,0,0.85),0_0_40px_rgba(252,191,73,0.4)] p-6 sm:p-8 flex flex-col items-center text-center transform scale-95 transition-transform duration-300 font-['Poppins',sans-serif]">
            
            <!-- Resplandor ambiental de fondo -->
            <div class="absolute -top-16 -right-16 w-44 h-44 bg-[#FCBF49]/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-16 -left-16 w-44 h-44 bg-[#C1121F]/25 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Botón Cerrar (X) -->
            <button id="close-collectible-modal" type="button" 
                class="absolute top-4 right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-9 h-9 flex items-center justify-center transition-colors cursor-pointer text-base font-bold z-10"
                aria-label="Cerrar modal">
                ✕
            </button>

            <!-- Imagen grande del coleccionable -->
            <div class="w-full max-w-[320px] sm:max-w-[400px] md:max-w-[440px] aspect-square flex items-center justify-center p-2 mb-5 bg-[#0A1A32]/90 rounded-2xl border border-white/15 shadow-2xl group">
                <img id="modal-card-img" src="" alt="Coleccionable" 
                    class="w-full h-full object-contain drop-shadow-2xl transition-transform duration-300 group-hover:scale-105" />
            </div>

            <!-- Etiqueta de Tipo con estilo NorthBase -->
            <span id="modal-card-tag" 
                class="inline-block px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest bg-gradient-to-r from-[#F77F00] to-[#FCBF49] text-[#003049] mb-2.5 shadow-md">
                COLECCIONABLE
            </span>

            <!-- Nombre oficial del coleccionable -->
            <h3 id="modal-card-name" 
                class="text-xl sm:text-2xl font-bold text-white mb-2 leading-tight">
            </h3>

            <!-- Descripción del logro / coleccionable -->
            <p id="modal-card-desc" 
                class="text-xs sm:text-sm md:text-base text-[#669BBC] font-normal leading-relaxed max-w-lg mb-4 text-center">
            </p>

            <!-- Fecha de desbloqueo -->
            <div id="modal-card-date" class="text-xs sm:text-sm text-white/70 font-medium">
            </div>
        </div>
    </div>

    <script src="./src/js/auth.js"></script>
    <script src="./src/js/profile.js"></script>
</body>

</html>
