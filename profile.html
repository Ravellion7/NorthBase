<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body
    class="bg-[#0A1A32] overflow-x-hidden flex flex-col min-h-screen items-center justify-between m-0 p-0 relative font-['Poppins',sans-serif]">


    <header class="w-full bg-transparent px-4 sm:px-6 py-4 absolute top-0 left-0 z-30">
        <div class="max-w-7xl mx-auto flex items-center justify-between">


            <a href="./home.html"
                class="inline-flex items-center gap-1.5 text-white/90 hover:text-white font-medium text-xs sm:text-sm py-1.5 px-3 rounded-lg hover:bg-white/10 transition-colors"
                aria-label="Regresar al inicio">
                <span>Regresar</span>
            </a>


            <a href="./camera.html"
                class="flex items-center justify-center p-2 rounded-full hover:bg-white/10 transition-all cursor-pointer"
                aria-label="Abrir cámara">
                <img src="./src/assets/camera.png" alt="Cámara"
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain brightness-0 invert" />
            </a>

        </div>
    </header>


    <div class="w-full flex-1 flex flex-col items-center justify-center pt-14 pb-4 px-4 z-10">


        <div
            class="w-32 h-32 sm:w-36 sm:h-36 rounded-full border-4 border-white shadow-2xl overflow-hidden bg-white flex items-center justify-center">
            <img src="./src/assets/default profile.png" alt="Foto de perfil" class="w-full h-full object-cover" />
        </div>


        <h1
            class="text-white font-['Poppins',sans-serif] font-normal text-xl sm:text-2xl mt-4 sm:mt-5 tracking-wide drop-shadow-sm">
            Usuario
        </h1>

    </div>


    <div
        class="w-full h-[50vh] min-h-[340px] bg-[#F5F5F5] rounded-t-[2.5rem] shadow-2xl p-6 sm:p-8 flex flex-col items-center justify-start z-20">


        <a href="./edit_profile.html"
            class="inline-block px-8 py-2 sm:px-10 sm:py-2.5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer tracking-wide mb-6 sm:mb-8 text-center">
            Editar perfil
        </a>



        <div class="w-full max-w-sm sm:max-w-md grid grid-cols-2 gap-4 sm:gap-6">


            <div
                class="aspect-[3/4] bg-transparent border-2 border-orange-500 rounded-2xl shadow-lg shadow-amber-400/40 hover:shadow-amber-400/60 transition-all hover:scale-[1.02] cursor-pointer">
            </div>


            <div
                class="aspect-[3/4] bg-transparent border-2 border-orange-500 rounded-2xl shadow-lg shadow-amber-400/40 hover:shadow-amber-400/60 transition-all hover:scale-[1.02] cursor-pointer">
            </div>

        </div>

    </div>

</body>

</html>
