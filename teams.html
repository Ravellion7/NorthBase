<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Team Select</title>
    <!-- Google Font: Anton -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<!-- 1. Ensure body has zero margins/padding -->

<body class="bg-[#F5F5F5] overflow-x-hidden flex flex-col min-h-screen items-center m-0 p-0">
    <!-- 2. HEADER (Responsive: Mobile Menu vs Desktop Navigation) -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between relative h-10 sm:h-12">

            <!-- 1. LEFT: Mobile Hamburger Menu & Desktop Balancer -->
            <div class="flex items-center gap-2 sm:gap-3">

                <!-- Mobile Hamburger (Hidden on Desktop) -->
                <div class="relative md:hidden">
                    <button id="menu-btn"
                        class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                        aria-label="Abrir Menú">
                        <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                            class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="menu-dropdown"
                        class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                        <a href="./home.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Home
                        </a>
                        <a href="./trivia_select.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Trivia
                        </a>
                        <a href="./camera.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Cámara
                        </a>
                        <a href="./gallery.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Galería
                        </a>
                        <a href="./teams.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Equipos
                        </a>
                    </div>
                </div>

                <!-- Cards Game Button (Goes to game.html) -->
                <a href="./game.html"
                    class="w-9 h-9 sm:w-10 sm:h-10 overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shrink-0 p-1"
                    aria-label="Ir al juego de cartas">
                    <img src="./src/assets/cards icon.png" alt="Juego de Cartas" class="w-full h-full object-contain" />
                </a>

            </div>

            <!-- 2. CENTER: Navigation (Desktop "Trivia" & "Cámara" - Pentagon Logo - "Galería" & "Equipos") -->
            <div
                class="flex items-center gap-6 sm:gap-8 md:gap-8 lg:gap-12 absolute left-1/2 -translate-x-1/2 top-0 h-full z-20">

                <!-- Desktop "Trivia" Link -->
                <a href="./trivia_select.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Trivia
                </a>

                <!-- Desktop "Cámara" Link -->
                <a href="./camera.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Cámara
                </a>

                <!-- Center Pentagon Logo (Considerably Larger Size) -->
                <div class="drop-shadow-xl self-start">
                    <a href="./home.html"
                        class="w-20 h-24 sm:w-24 sm:h-28 md:w-36 md:h-44 lg:w-40 lg:h-48 bg-white flex items-center justify-center pt-1 pb-4 md:pt-3 md:pb-8 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                        aria-label="Ir al inicio">
                        <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                            class="w-15 h-15 sm:w-18 sm:h-18 md:w-28 md:h-28 lg:w-32 lg:h-32 object-contain" />
                    </a>
                </div>



                <!-- Desktop "Galería" Link -->
                <a href="./gallery.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Galería
                </a>

                <!-- Desktop "Equipos" Link -->
                <a href="./teams.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Equipos
                </a>
            </div>

            <!-- 3. RIGHT: Profile Button (Takes you to profile.html) -->
            <a href="./profile.html"
                class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-white overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shadow-md bg-white shrink-0"
                aria-label="Ir al perfil">
                <img src="./src/assets/default profile.png" alt="Perfil" class="w-full h-full object-cover" />
            </a>

        </div>
    </header>

    <!-- MAIN TEAMS SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-6 sm:pt-10 md:pt-14 lg:pt-20 pb-16">


        <!-- Title Image (Aligned to Left of Content on 90vw Container) -->
        <div class="w-full max-w-lg sm:max-w-xl md:w-[90vw] md:max-w-none flex justify-start pl-2 sm:pl-3 mb-6 sm:mb-8">
            <img src="./src/assets/Equipos Baseball.png" alt="Equipos Baseball"
                class="w-52 sm:w-64 md:w-72 lg:w-80 h-auto object-contain drop-shadow-sm" />
        </div>

        <!-- 2 Rows x 3 Columns of Team Containers on Desktop (90% Screen Width) -->
        <div
            class="w-full max-w-lg sm:max-w-xl md:w-[90vw] md:max-w-none grid grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6 md:gap-8 lg:gap-10">

            <!-- Team 1: Sultanes (redirects to sultanes.html) -->
            <a href="./sultanes.html"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/Sultanes logo.png" alt="Sultanes de Monterrey"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

            <!-- Team 2: Rieleros -->
            <a href="#"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/rieleros logo.png" alt="Rieleros de Aguascalientes"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

            <!-- Team 3: Charros -->
            <a href="#"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/Charros logo.png" alt="Charros de Jalisco"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

            <!-- Team 4: Algodoneros -->
            <a href="#"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/algodoneros logo.png" alt="Algodoneros de Unión Laguna"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

            <!-- Team 5: Calientes -->
            <a href="#"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/calientes logo.png" alt="Calientes de Durango"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

            <!-- Team 6: Acereros -->
            <a href="#"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/acereros logo.png" alt="Acereros de Monclova"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

            <!-- Team 7: Toros -->
            <a href="#"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/toros logo.png" alt="Toros de Tijuana"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

            <!-- Team 8: Saraperos -->
            <a href="#"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/saraperos logo.png" alt="Saraperos de Saltillo"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

            <!-- Team 9: Tecos -->
            <a href="#"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/tecos logo.png" alt="Tecolotes de los Dos Laredos"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

            <!-- Team 10: Dorados -->
            <a href="#"
                class="aspect-square md:aspect-[4/3] lg:aspect-[16/10] bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-900/15 hover:shadow-2xl hover:shadow-slate-900/25 flex flex-col items-center justify-center transition-all hover:scale-[1.02] cursor-pointer p-4 group">
                <img src="./src/assets/dorados logo.png" alt="Dorados de Chihuahua"
                    class="max-h-[60%] max-w-[60%] object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
            </a>

        </div>


    </main>



    <script src="./src/js/index.js"></script>

</body>

</html>
