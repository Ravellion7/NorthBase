<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Home</title>
    <!-- Google Font: Anton -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<!-- 1. Ensure body has zero margins/padding -->

<body class="bg-white flex flex-col min-h-screen items-center m-0 p-0">
    <!-- 2. Pinned to top (sticky top-0 z-30) and using shadow-xl instead of drop-shadow-xl -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- 1. LEFT: Menu Button & Dropdown -->
            <div class="relative">
                <button id="menu-btn"
                    class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                    aria-label="Abrir Menú">
                    <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                        class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                </button>
                <!-- Dropdown Menu -->
                <div id="menu-dropdown"
                    class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                    <a href="./home.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Home
                    </a>
                    <a href="./trivia_select.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Trivia
                    </a>
                    <a href="./camera.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Cámara
                    </a>
                    <a href="./gallery.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Galería
                    </a>
                    <a href="./teams.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Equipos
                    </a>
                </div>
            </div>
            <!-- CENTER: Upside-Down White Pentagon (retains drop-shadow-xl for polygon) -->
            <div class="absolute left-1/2 -translate-x-1/2 top-0 z-20 drop-shadow-xl">
                <a href="./index.html"
                    class="w-20 h-24 sm:w-22 sm:h-26 bg-white flex items-center justify-center pt-1 pb-4 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                    aria-label="Ir al inicio">
                    <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                        class="w-15 h-15 sm:w-17 sm:h-17 object-contain" />
                </a>
            </div>
            <!-- 3. RIGHT: Profile Button (Takes you to profile.html) -->
            <a href="./profile.html"
                class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-white overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shadow-md bg-white shrink-0"
                aria-label="Ir al perfil">
                <img src="./src/assets/default profile.png" alt="Perfil" class="w-full h-full object-cover" />
            </a>

        </div>
    </header>

    <!-- MAIN HOME SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-25 sm:pt-10 pb-16">
        <!-- Title Image (Closer to header, more bottom spacing) -->
        <div class="flex justify-center mb-20 sm:mb-24 md:mb-28">
            <img src="./src/assets/Northbase texto.png" alt="NorthBase"
                class="w-60 sm:w-80 md:w-96 h-auto object-contain drop-shadow-sm" />
        </div>

        <!-- 3 Cards Container (With Orange-Yellow Glow) -->
        <div class="w-full max-w-4xl grid grid-cols-3 gap-3 sm:gap-6 md:gap-8 items-end justify-center px-2">
            <!-- Card 1 (Left) -->
            <div
                class="bg-white border border-orange-200 border-b-4 border-b-orange-500 rounded-xl sm:rounded-2xl p-4 sm:p-6 h-52 sm:h-64 md:h-72 shadow-lg shadow-amber-400/35 flex flex-col items-center justify-center transition-all hover:scale-[1.02] hover:shadow-amber-400/50">
                <span class="text-orange-500 font-['Poppins',sans-serif] font-semibold text-xs sm:text-sm"></span>
            </div>
            <!-- Card 2 (Middle - Elevated / Higher) -->
            <div
                class="bg-white border border-orange-200 border-b-4 border-b-orange-500 rounded-xl sm:rounded-2xl p-4 sm:p-6 h-52 sm:h-64 md:h-72 shadow-lg shadow-amber-400/35 flex flex-col items-center justify-center transition-all hover:scale-[1.02] hover:shadow-amber-400/50 -translate-y-4 sm:-translate-y-8">
                <span class="text-orange-500 font-['Poppins',sans-serif] font-semibold text-xs sm:text-sm"></span>
            </div>
            <!-- Card 3 (Right) -->
            <div
                class="bg-white border border-orange-200 border-b-4 border-b-orange-500 rounded-xl sm:rounded-2xl p-4 sm:p-6 h-52 sm:h-64 md:h-72 shadow-lg shadow-amber-400/35 flex flex-col items-center justify-center transition-all hover:scale-[1.02] hover:shadow-amber-400/50">
                <span class="text-orange-500 font-['Poppins',sans-serif] font-semibold text-xs sm:text-sm"></span>
            </div>
        </div>

        <!-- Bottom-Center "¡Comienza ya!" Button -->
        <div class="mt-25 sm:mt-28 flex justify-center">
            <a href="./trivia_select.html"
                class="inline-block px-8 py-2.5 sm:px-10 sm:py-3 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-200 text-center tracking-wide whitespace-nowrap">
                ¡Comienza ya!
            </a>
        </div>


    </main>


    <script src="./src/js/index.js"></script>

</body>

</html>
