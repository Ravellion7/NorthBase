<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Login</title>
    <!-- Google Font: Anton -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-white flex flex-col min-h-screen items-center m-0 p-0">
    <!-- 2. Pinned to top (sticky top-0 z-30) and using shadow-xl instead of drop-shadow-xl -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- 1. LEFT: Menu Button & Dropdown -->
            <div class="relative">
                <button id="menu-btn"
                    class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                    aria-label="Abrir Menú">
                    <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                        class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                </button>
                <!-- Dropdown Menu -->
                <div id="menu-dropdown"
                    class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                    <a href="index.html#home"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Home
                    </a>
                    <a href="index.html#nosotros"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Nosotros
                    </a>
                    <a href="index.html#conoce"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Conoce
                    </a>
                </div>
            </div>
            <!-- CENTER: Upside-Down White Pentagon (retains drop-shadow-xl for polygon) -->
            <div class="absolute left-1/2 -translate-x-1/2 top-0 z-20 drop-shadow-xl">
                <div
                    class="w-20 h-24 sm:w-22 sm:h-26 bg-white flex items-center justify-center pt-1 pb-4 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)]">
                    <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                        class="w-15 h-15 sm:w-17 sm:h-17 object-contain" />
                </div>
            </div>
            <!-- 3. RIGHT: Spacer -->
            <div class="w-10"></div>
        </div>
    </header>

    <!-- MAIN LOGIN SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-20 sm:pt-8 pb-16 sm:pb-24">
        <!-- Form Wrapper (More compact width) -->
        <div class="w-full max-w-xs sm:max-w-sm flex flex-col items-center">

            <!-- Title Image in the exact same position -->
            <div class="flex justify-center mb-5">
                <img src="./src/assets/login.png" alt="¡Comienza Ya!"
                    class="w-56 sm:w-72 h-auto object-contain drop-shadow-sm" />
            </div>
            <!-- Login Form (Compact inputs and spacing) -->
            <form action="./home.html" method="GET" class="w-full flex flex-col gap-3.5 bg-transparent pt-10">
                <!-- Email Field -->
                <div class="flex flex-col gap-1">
                    <label for="email"
                        class="font-['Poppins',sans-serif] text-xs sm:text-sm font-semibold text-slate-700">
                        Correo electrónico
                    </label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="ejemplo@correo.com"
                        required
                        class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
                </div>
                <!-- Password Field -->
                <div class="flex flex-col gap-1">
                    <label for="password"
                        class="font-['Poppins',sans-serif] text-xs sm:text-sm font-semibold text-slate-700">
                        Contraseña
                    </label>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        placeholder="••••••••" required
                        class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
                </div>
                <!-- Red "Ingresar" Button -->
                <button type="submit"
                    class="w-full mt-2 py-2.5 px-5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer tracking-wide">
                    Ingresar
                </button>
            </form>
            <!-- Black Straight Horizontal Line -->
            <div class="w-full h-[2.5px] bg-black my-5"></div>
            <!-- Underlined Question Text -->
            <p
                class="font-['Poppins',sans-serif] text-xs sm:text-sm text-black underline font-semibold text-center mb-3">
                ¿Aún no tienes cuenta?
            </p>
            <!-- Red "Registrarse" Button -->
            <a href="register.html"
                class="w-full text-center py-2.5 px-5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer tracking-wide">
                Registrarse
            </a>
        </div>
    </main>

    <script src="./src/js/index.js"></script>

</body>

</html>
