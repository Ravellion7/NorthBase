<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Trivia</title>
    <!-- Google Font: Anton -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<!-- 1. Ensure body has zero margins/padding -->

<body class="bg-white flex flex-col min-h-screen items-center m-0 p-0">
    <!-- 2. Pinned to top (sticky top-0 z-30) and using shadow-xl instead of drop-shadow-xl -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- 1. LEFT: Menu Button & Dropdown -->
            <div class="relative">
                <button id="menu-btn"
                    class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                    aria-label="Abrir Menú">
                    <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                        class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                </button>
                <!-- Dropdown Menu -->
                <div id="menu-dropdown"
                    class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                    <a href="./home.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Home
                    </a>
                    <a href="./trivia_select.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Trivia
                    </a>
                    <a href="./camera.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Cámara
                    </a>
                    <a href="./gallery.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Galería
                    </a>
                    <a href="./teams.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Equipos
                    </a>
                </div>
            </div>
            <!-- CENTER: Upside-Down White Pentagon (retains drop-shadow-xl for polygon) -->
            <div class="absolute left-1/2 -translate-x-1/2 top-0 z-20 drop-shadow-xl">
                <a href="./index.html"
                    class="w-20 h-24 sm:w-22 sm:h-26 bg-white flex items-center justify-center pt-1 pb-4 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                    aria-label="Ir al inicio">
                    <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                        class="w-15 h-15 sm:w-17 sm:h-17 object-contain" />
                </a>
            </div>
            <!-- 3. RIGHT: Profile Button (Takes you to profile.html) -->
            <a href="./profile.html"
                class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-white overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shadow-md bg-white shrink-0"
                aria-label="Ir al perfil">
                <img src="./src/assets/default profile.png" alt="Perfil" class="w-full h-full object-cover" />
            </a>

        </div>
    </header>

    <!-- MAIN TRIVIA GAMEPLAY SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-12 sm:pt-16 pb-16">

        <!-- Title Image -->
        <div class="flex justify-center mb-12 sm:mb-16">
            <img src="./src/assets/NORTHBASE Trivia.png" alt="NORTHBASE Trivia"
                class="w-60 sm:w-80 md:w-96 h-auto object-contain drop-shadow-sm" />
        </div>


        <!-- Progress Bar Container (With Shadow) -->
        <div
            class="w-[80%] max-w-xl bg-slate-200 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-md shadow-black/15 mb-4 sm:mb-5">
            <!-- Progress Fill -->
            <div class="bg-[#0A1A32] h-full w-[25%] rounded-full transition-all duration-300"></div>
        </div>

        <!-- Trivia Question Container -->
        <div
            class="relative w-full max-w-xl sm:max-w-2xl min-h-[460px] sm:min-h-[500px] bg-white border border-orange-200 border-b-6 border-b-orange-500 rounded-xl sm:rounded-2xl p-6 sm:p-8 pb-8 sm:pb-10 shadow-lg shadow-amber-400/40 flex flex-col justify-start">

            <!-- Top Bar: Baseball Icon + Counter (Left) and Exit Button (Right) -->
            <div class="w-full flex items-center justify-between mb-4 sm:mb-5">
                <!-- Baseball Icon + Question Counter -->
                <div class="flex items-center gap-2 sm:gap-2.5">
                    <img src="./src/assets/baseball.png" alt="Baseball" class="w-7 h-7 sm:w-8 sm:h-8 object-contain" />
                    <span
                        class="font-['Poppins',sans-serif] font-bold text-slate-700 text-sm sm:text-base tracking-wide">
                        1/10
                    </span>
                </div>

                <!-- Exit Button -->
                <a href="./trivia_select.html"
                    class="font-['Poppins',sans-serif] font-semibold text-xs sm:text-sm text-slate-400 hover:text-[#C1121F] bg-transparent transition-colors px-2 py-1 rounded-md cursor-pointer"
                    aria-label="Salir de la trivia">
                    Exit ✕
                </a>
            </div>

            <!-- Question and Options Group -->
            <div class="w-full flex flex-col items-center">
                <!-- Question Text (Nicely positioned below the top bar) -->
                <h2
                    class="font-['Poppins',sans-serif] text-xl sm:text-2xl font-bold text-black text-center mt-5 mb-10 sm:mb-6 leading-snug">
                    ¿Pregunta de la trivia?
                </h2>

                <!-- 4 Trivia Options (Moderate gap-4 sm:gap-4.5) -->
                <div class="w-full flex flex-col gap-4 sm:gap-4.5">
                    <!-- Option 1 -->
                    <button type="button"
                        class="w-full h-10 sm:h-11 px-4 bg-white border-2 border-black border-b-4 rounded-xl font-['Poppins',sans-serif] font-medium text-slate-900 text-xs sm:text-sm text-left hover:bg-slate-50 active:scale-[0.99] transition-all cursor-pointer shadow-sm">
                    </button>

                    <!-- Option 2 -->
                    <button type="button"
                        class="w-full h-10 sm:h-11 px-4 bg-white border-2 border-black border-b-4 rounded-xl font-['Poppins',sans-serif] font-medium text-slate-900 text-xs sm:text-sm text-left hover:bg-slate-50 active:scale-[0.99] transition-all cursor-pointer shadow-sm">
                    </button>

                    <!-- Option 3 -->
                    <button type="button"
                        class="w-full h-10 sm:h-11 px-4 bg-white border-2 border-black border-b-4 rounded-xl font-['Poppins',sans-serif] font-medium text-slate-900 text-xs sm:text-sm text-left hover:bg-slate-50 active:scale-[0.99] transition-all cursor-pointer shadow-sm">
                    </button>

                    <!-- Option 4 -->
                    <button type="button"
                        class="w-full h-10 sm:h-11 px-4 bg-white border-2 border-black border-b-4 rounded-xl font-['Poppins',sans-serif] font-medium text-slate-900 text-xs sm:text-sm text-left hover:bg-slate-50 active:scale-[0.99] transition-all cursor-pointer shadow-sm">
                    </button>
                </div>
            </div>

        </div>

        <!-- "Siguiente" Button (Below Container) -->
        <div class="mt-8 sm:mt-10 flex justify-center">
            <button type="button"
                class="px-10 py-2.5 sm:px-12 sm:py-3 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-200 text-center tracking-wide whitespace-nowrap cursor-pointer">
                Siguiente
            </button>
        </div>


    </main>



    <script src="./src/js/index.js"></script>

</body>

</html>
