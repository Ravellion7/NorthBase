<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Sultanes Gallery</title>
    <!-- Google Font: Anton & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-[#F5F5F5] overflow-x-hidden flex flex-col min-h-screen items-center m-0 p-0">
    <!-- 2. HEADER (Responsive: Mobile Menu vs Desktop Navigation) -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between relative h-10 sm:h-12">

            <!-- 1. LEFT: Mobile Hamburger Menu & Desktop Balancer -->
            <div class="flex items-center gap-2 sm:gap-3">

                <!-- Mobile Hamburger (Hidden on Desktop) -->
                <div class="relative md:hidden">
                    <button id="menu-btn"
                        class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                        aria-label="Abrir Menú">
                        <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                            class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="menu-dropdown"
                        class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                        <a href="./home.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Home
                        </a>
                        <a href="./trivia_select.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Trivia
                        </a>
                        <a href="./camera.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Cámara
                        </a>
                        <a href="./gallery.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Galería
                        </a>
                        <a href="./teams.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Equipos
                        </a>
                    </div>
                </div>

                <!-- Cards Game Button (Goes to game.html) -->
                <a href="./game.html"
                    class="w-9 h-9 sm:w-10 sm:h-10 overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shrink-0 p-1"
                    aria-label="Ir al juego de cartas">
                    <img src="./src/assets/cards icon.png" alt="Juego de Cartas" class="w-full h-full object-contain" />
                </a>

            </div>

            <!-- 2. CENTER: Navigation (Desktop "Trivia" & "Cámara" - Pentagon Logo - "Galería" & "Equipos") -->
            <div
                class="flex items-center gap-6 sm:gap-8 md:gap-8 lg:gap-12 absolute left-1/2 -translate-x-1/2 top-0 h-full z-20">

                <!-- Desktop "Trivia" Link -->
                <a href="./trivia_select.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Trivia
                </a>

                <!-- Desktop "Cámara" Link -->
                <a href="./camera.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Cámara
                </a>

                <!-- Center Pentagon Logo (Considerably Larger Size) -->
                <div class="drop-shadow-xl self-start">
                    <a href="./home.html"
                        class="w-20 h-24 sm:w-24 sm:h-28 md:w-36 md:h-44 lg:w-40 lg:h-48 bg-white flex items-center justify-center pt-1 pb-4 md:pt-3 md:pb-8 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                        aria-label="Ir al inicio">
                        <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                            class="w-15 h-15 sm:w-18 sm:h-18 md:w-28 md:h-28 lg:w-32 lg:h-32 object-contain" />
                    </a>
                </div>

                <!-- Desktop "Galería" Link -->
                <a href="./gallery.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Galería
                </a>

                <!-- Desktop "Equipos" Link -->
                <a href="./teams.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Equipos
                </a>
            </div>

            <!-- 3. RIGHT: Profile Button (Takes you to profile.html) -->
            <a href="./profile.html"
                class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-white overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shadow-md bg-white shrink-0"
                aria-label="Ir al perfil">
                <img src="./src/assets/default profile.png" alt="Perfil" class="w-full h-full object-cover" />
            </a>

        </div>
    </header>

    <!-- MAIN SULTANES GALLERY SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-12 sm:pt-16 md:pt-18 lg:pt-20 pb-16">

        <!-- Top Row: Sultanes Mty Image (Left) + Regresar Button with Thicker Black Border (Right) -->
        <div
            class="w-full max-w-lg sm:max-w-xl md:w-[90vw] md:max-w-none flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 sm:mb-8">
            <!-- Left: Sultanes Image -->
            <div class="flex justify-start pl-2 sm:pl-3">
                <img src="./src/assets/Sultanes Mty.png" alt="Sultanes de Monterrey"
                    class="w-52 sm:w-64 md:w-72 lg:w-80 h-auto object-contain drop-shadow-sm" />
            </div>

            <!-- Right: "Regresar" Button (Thicker Black Border) -->
            <div class="flex justify-start md:justify-end pl-2 sm:pl-3 md:pl-0">
                <a href="./sultanes.html"
                    class="inline-flex items-center justify-center px-5 py-2 sm:px-6 sm:py-2.5 bg-white hover:bg-slate-100 text-black font-['Poppins',sans-serif] font-semibold text-xs sm:text-sm md:text-base border-2 border-black border-b-4 rounded-xl shadow-sm hover:shadow-md hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer tracking-wide whitespace-nowrap">
                    Regresar
                </a>
            </div>
        </div>

        <!-- 1 Row of 3 Containers (Distributed to Occupy 90% Screen Width) -->
        <div
            class="w-full max-w-lg sm:max-w-xl md:w-[90vw] md:max-w-none grid grid-cols-3 gap-3 sm:gap-6 md:gap-8 lg:gap-10 mb-10 sm:mb-14 md:mb-16">

            <!-- Container 1: Sultanes Pic 1 -->
            <div
                class="gallery-item aspect-square md:aspect-[4/3] lg:aspect-[16/10] shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 rounded-xl sm:rounded-2xl overflow-hidden flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer group">
                <img src="./src/assets/sultanes pic.jpg" alt="Sultanes de Monterrey Foto 1"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
            </div>

            <!-- Container 2: Sultanes Pic 2 -->
            <div
                class="gallery-item aspect-square md:aspect-[4/3] lg:aspect-[16/10] shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 rounded-xl sm:rounded-2xl overflow-hidden flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer group">
                <img src="./src/assets/sultanes pic2.jpg" alt="Sultanes de Monterrey Foto 2"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
            </div>

            <!-- Container 3: Sultanes Pic 3 -->
            <div
                class="gallery-item aspect-square md:aspect-[4/3] lg:aspect-[16/10] shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 rounded-xl sm:rounded-2xl overflow-hidden flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer group">
                <img src="./src/assets/sultanes pic3.jpg" alt="Sultanes de Monterrey Foto 3"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
            </div>

        </div>


        <!-- 2. Videos Title Image -->
        <div class="w-full max-w-lg sm:max-w-xl md:w-[90vw] md:max-w-none flex justify-start pl-2 sm:pl-3 mb-4 sm:mb-6">
            <img src="./src/assets/Videos.png" alt="Vídeos"
                class="w-24 sm:w-28 md:w-32 h-auto object-contain drop-shadow-sm" />
        </div>

        <!-- Single Container Below Videos -->
        <div
            class="w-full max-w-lg sm:max-w-xl md:w-[90vw] md:max-w-none grid grid-cols-3 gap-3 sm:gap-6 md:gap-8 lg:gap-10">
            <div
                class="gallery-item aspect-square md:aspect-[4/3] lg:aspect-[16/10] shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 rounded-xl sm:rounded-2xl overflow-hidden flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer group relative bg-black">
                <!-- Video Thumbnail -->
                <video src="./src/assets/sultanes vid.mp4" muted playsinline
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                </video>
                <!-- Play Icon Overlay -->
                <div
                    class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-transparent transition-colors pointer-events-none">
                    <div
                        class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/90 flex items-center justify-center shadow-lg">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 text-black fill-current ml-0.5" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Full-Size Image & Video Modal -->
        <div id="gallery-modal"
            class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center p-4 transition-opacity duration-300">

            <!-- Close Button (Top Right) -->
            <button id="modal-close-btn" type="button"
                class="absolute top-6 right-6 text-white/80 hover:text-white text-3xl font-bold p-2 z-50 transition-transform hover:scale-110 cursor-pointer"
                aria-label="Cerrar vista completa">
                ✕
            </button>

            <!-- Media Container (Image or Video) -->
            <div
                class="relative max-w-4xl max-h-[70vh] flex items-center justify-center rounded-2xl overflow-hidden shadow-2xl">
                <img id="modal-img" src="" alt="Vista previa"
                    class="hidden max-w-full max-h-[70vh] object-contain rounded-2xl transition-all duration-300" />
                <video id="modal-video" src="" controls autoplay playsinline
                    class="hidden max-w-full max-h-[70vh] object-contain rounded-2xl transition-all duration-300">
                </video>
            </div>


            <!-- Bottom Circles (Same design as camera.html) -->
            <div class="absolute bottom-8 left-0 right-0 flex items-center justify-center gap-3 sm:gap-4 z-50">
                <!-- Circle 1 -->
                <button type="button"
                    class="filter-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Circle 2 -->
                <button type="button"
                    class="filter-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Circle 3 -->
                <button type="button"
                    class="filter-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Circle 4 -->
                <button type="button"
                    class="filter-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Circle 5 -->
                <button type="button"
                    class="filter-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>
            </div>

        </div>


    </main>

    <script src="./src/js/index.js"></script>
    <script src="./src/js/gallery.js"></script>
</body>


</html>
