<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Sultanes Gallery</title>
    <!-- Google Font: Anton & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-white flex flex-col min-h-screen items-center m-0 p-0">
    <!-- Header -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- LEFT: Menu Button & Dropdown -->
            <div class="relative">
                <button id="menu-btn"
                    class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                    aria-label="Abrir Menú">
                    <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                        class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                </button>
                <!-- Dropdown Menu -->
                <div id="menu-dropdown"
                    class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                    <a href="./home.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Home
                    </a>
                    <a href="./trivia_select.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Trivia
                    </a>
                    <a href="./camera.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Cámara
                    </a>
                    <a href="./gallery.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Galería
                    </a>
                    <a href="./teams.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Equipos
                    </a>
                </div>
            </div>
            <!-- CENTER: Pentagon Logo -->
            <div class="absolute left-1/2 -translate-x-1/2 top-0 z-20 drop-shadow-xl">
                <a href="./index.html"
                    class="w-20 h-24 sm:w-22 sm:h-26 bg-white flex items-center justify-center pt-1 pb-4 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                    aria-label="Ir al inicio">
                    <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                        class="w-15 h-15 sm:w-17 sm:h-17 object-contain" />
                </a>
            </div>
            <!-- RIGHT: Spacer -->
            <div class="w-10"></div>
        </div>
    </header>

    <!-- MAIN SULTANES GALLERY SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-16 sm:pt-20 pb-16">

        <!-- Top Button: "Explorar Multimedia" (Transparent Background) -->
        <div class="w-full max-w-lg sm:max-w-xl flex justify-start pl-2 sm:pl-3 mb-3 sm:mb-4">
            <a href="./sultanes.html"
                class="inline-flex items-center gap-1.5 bg-transparent hover:bg-slate-100 text-slate-700 hover:text-black font-['Poppins',sans-serif] font-medium text-xs sm:text-sm py-1.5 px-3 rounded-lg border border-slate-300 hover:border-slate-400 transition-all cursor-pointer">
                <span>Regresar</span>
            </a>
        </div>

        <!-- Title Image: Sultanes Mty -->
        <div class="w-full max-w-lg sm:max-w-xl flex justify-start pl-2 sm:pl-3 mb-4 sm:mb-6">
            <img src="./src/assets/Sultanes Mty.png" alt="Sultanes de Monterrey"
                class="w-52 sm:w-64 md:w-72 h-auto object-contain drop-shadow-sm" />
        </div>

        <!-- 2 Rows x 3 Columns of Square Containers (Photos) -->
        <div class="w-full max-w-lg sm:max-w-xl grid grid-cols-3 gap-3 sm:gap-4 mb-14 sm:mb-18 md:mb-20">

            <!-- Row 1 -->
            <div
                class="aspect-square bg-white border border-slate-200 shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer">
            </div>

            <div
                class="aspect-square bg-white border border-slate-200 shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer">
            </div>

            <div
                class="aspect-square bg-white border border-slate-200 shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer">
            </div>

            <!-- Row 2 -->
            <div
                class="aspect-square bg-white border border-slate-200 shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer">
            </div>

            <div
                class="aspect-square bg-white border border-slate-200 shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer">
            </div>

            <div
                class="aspect-square bg-white border border-slate-200 shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer">
            </div>

        </div>

        <!-- Videos Title Image -->
        <div class="w-full max-w-lg sm:max-w-xl flex justify-start pl-2 sm:pl-3 mb-4 sm:mb-6">
            <img src="./src/assets/Videos.png" alt="Vídeos"
                class="w-24 sm:w-28 md:w-32 h-auto object-contain drop-shadow-sm" />
        </div>

        <!-- Single Square Container Below Videos -->
        <div class="w-full max-w-lg sm:max-w-xl grid grid-cols-3 gap-3 sm:gap-4">
            <div
                class="aspect-square bg-white border border-slate-200 shadow-xl shadow-black/25 hover:shadow-2xl hover:shadow-black/35 flex items-center justify-center transition-all hover:scale-[1.02] cursor-pointer">
            </div>
        </div>

    </main>



    <script src="./src/js/index.js"></script>
</body>

</html>
