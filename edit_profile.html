<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Editar Perfil</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./src/assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./src/assets/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="./src/assets/favicon_io/favicon.ico">
    <link rel="manifest" href="./src/assets/favicon_io/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body
    class="bg-[#0A1A32] overflow-x-hidden flex flex-col min-h-screen items-center justify-between m-0 p-0 relative font-['Poppins',sans-serif]">

    <!-- Encabezado con Regresar y Cámara -->
    <header class="w-full bg-transparent px-4 sm:px-6 py-4 absolute top-0 left-0 z-30">
        <div class="max-w-7xl mx-auto flex items-center justify-between">

            <a href="./profile.html"
                class="inline-flex items-center gap-1.5 text-white/90 hover:text-white font-medium text-xs sm:text-sm py-1.5 px-3 rounded-lg hover:bg-white/10 transition-colors"
                aria-label="Regresar al perfil">
                <span>← Regresar al perfil</span>
            </a>

            <a href="./camera.html"
                class="flex items-center justify-center p-2 rounded-full hover:bg-white/10 transition-all cursor-pointer"
                aria-label="Abrir cámara">
                <img src="./src/assets/camera.png" alt="Cámara"
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain brightness-0 invert" />
            </a>

        </div>
    </header>

    <!-- Sección Superior: Avatar y Nombre -->
    <div class="w-full flex flex-col items-center justify-center pt-20 pb-6 px-4 z-10 shrink-0">

        <!-- Avatar Interactivo con botón para abrir el modal -->
        <div class="relative group cursor-pointer open-avatar-modal-btn mb-1" title="Haz clic para cambiar tu foto de perfil">
            <div
                class="w-24 h-24 sm:w-28 sm:h-28 rounded-full border-4 border-white shadow-2xl overflow-hidden bg-white flex items-center justify-center transition-transform hover:scale-105 relative">
                <img id="edit-profile-avatar" src="./src/assets/default profile.png" alt="Foto de perfil" class="w-full h-full object-cover" />
                <div
                    class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-full">
                    <span class="text-white text-[10px] font-bold uppercase tracking-wider">Cambiar</span>
                </div>
            </div>
            <div
                class="absolute bottom-0 right-0 bg-[#C1121F] text-white p-2 rounded-full shadow-lg border-2 border-white hover:scale-110 transition-transform">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
            </div>
        </div>

        <button type="button" class="open-avatar-modal-btn text-xs font-semibold text-[#FCBF49] hover:text-white mt-1 hover:underline cursor-pointer flex items-center gap-1">
            <span>Cambiar foto de perfil</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>

        <h1 id="edit-profile-username"
            class="text-white font-['Poppins',sans-serif] font-bold text-xl sm:text-2xl mt-2 tracking-wide drop-shadow-sm text-center">
            Usuario
        </h1>

    </div>

    <!-- Contenedor Inferior: Formulario de Edición -->
    <div
        class="w-full flex-1 bg-[#F5F5F5] rounded-t-[2.5rem] shadow-2xl px-6 py-8 sm:px-10 sm:py-10 flex flex-col items-center justify-start z-20">

        <form id="edit-profile-form"
            class="w-full max-w-[320px] sm:max-w-sm flex flex-col gap-3 sm:gap-3.5 bg-transparent p-0">

            <input type="hidden" id="foto_perfil" name="foto_perfil" value="" />

            <div class="flex flex-col gap-1">
                <label for="name" class="text-xs font-semibold text-slate-700">Nombre(s)</label>
                <input type="text" id="name" name="name" placeholder="Nombre(s)" aria-label="Nombre(s)" required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
            </div>

            <div class="flex flex-col gap-1">
                <label for="father_last_name" class="text-xs font-semibold text-slate-700">Apellido paterno</label>
                <input type="text" id="father_last_name" name="father_last_name" placeholder="Apellido paterno"
                    aria-label="Apellido paterno"
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
            </div>

            <div class="flex flex-col gap-1">
                <label for="mother_last_name" class="text-xs font-semibold text-slate-700">Apellido materno</label>
                <input type="text" id="mother_last_name" name="mother_last_name" placeholder="Apellido materno"
                    aria-label="Apellido materno"
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
            </div>

            <div class="flex flex-col gap-1">
                <label for="email" class="text-xs font-semibold text-slate-700">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="Correo" aria-label="Correo" required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
            </div>

            <div class="flex flex-col gap-1">
                <label for="favorite_team" class="text-xs font-semibold text-slate-700">Equipo favorito</label>
                <select id="favorite_team" name="favorite_team" aria-label="Equipo favorito"
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm cursor-pointer">
                    <option value="" disabled selected>Selecciona tu equipo favorito</option>
                    <option value="sultanes">Sultanes de Monterrey</option>
                    <option value="acereros">Acereros de Monclova</option>
                    <option value="algodoneros">Algodoneros del Unión Laguna</option>
                    <option value="caliente">Caliente de Durango</option>
                    <option value="charros">Charros de Jalisco</option>
                    <option value="dorados">Dorados de Chihuahua</option>
                    <option value="rieleros">Rieleros de Aguascalientes</option>
                    <option value="saraperos">Saraperos de Saltillo</option>
                    <option value="tecos">Tecos de los Dos Laredos</option>
                    <option value="toros">Toros de Tijuana</option>
                </select>
            </div>

            <div class="pt-2 border-t border-slate-200 mt-1">
                <p class="text-[11px] text-slate-500 mb-2 font-medium">¿Deseas cambiar tu contraseña? (opcional)</p>

                <div class="flex flex-col gap-2.5">
                    <input type="password" id="password" name="password" placeholder="Nueva contraseña (opcional)"
                        aria-label="Contraseña"
                        class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />

                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Confirmar nueva contraseña" aria-label="Confirmar contraseña"
                        class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
                </div>
            </div>

            <button type="submit"
                class="w-full mt-4 sm:mt-6 py-2.5 px-6 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer tracking-wide text-center">
                Actualizar
            </button>

        </form>

    </div>

    <!-- Modal para explorar y cambiar avatar -->
    <div id="avatar-picker-modal"
        class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 select-none opacity-0 transition-opacity duration-200">
        <div
            class="relative w-full max-w-lg bg-[#003049] border-2 border-[#FCBF49]/60 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.85)] p-5 sm:p-6 flex flex-col font-['Poppins',sans-serif] max-h-[92vh] overflow-hidden text-white">

            <!-- Botón Cerrar (X) -->
            <button type="button" id="close-avatar-modal"
                class="absolute top-4 right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center transition-colors cursor-pointer text-sm font-bold z-10"
                aria-label="Cerrar modal">
                ✕
            </button>

            <!-- Encabezado Modal -->
            <div class="text-center mb-3 pr-6 pl-2">
                <h3 class="text-lg sm:text-xl font-bold text-white flex items-center justify-center gap-2">
                    <span>Elige tu Avatar</span>
                </h3>
                <p class="text-xs text-[#669BBC] mt-0.5">
                    Selecciona cualquier avatar oficial de los equipos de la LMB
                </p>
            </div>

            <!-- Pestañas de Equipos con Scroll Horizontal -->
            <div class="mb-3">
                <span class="text-[10px] font-bold uppercase tracking-wider text-[#FCBF49] block mb-1.5 px-1">
                    Equipos:
                </span>
                <div id="modal-team-tabs" class="flex gap-2.5 overflow-x-auto py-2 px-1 custom-scrollbar items-center">
                    <!-- Pestañas insertadas dinámicamente -->
                </div>
            </div>

            <!-- Grid de los 3 avatares del equipo seleccionado en el modal -->
            <div class="flex-1 overflow-y-auto py-2 custom-scrollbar">
                <div class="text-center mb-3">
                    <span id="modal-active-team-name" class="text-sm font-bold text-white tracking-wide"></span>
                </div>
                <div id="modal-avatars-grid" class="grid grid-cols-3 gap-3 sm:gap-4 max-w-sm mx-auto">
                    <!-- 3 avatares renderizados -->
                </div>
            </div>

            <!-- Footer con Vista Previa y Botón Confirmar -->
            <div class="mt-3 pt-3 border-t border-white/10 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <img id="modal-preview-current" src="./src/assets/default profile.png"
                        class="w-9 h-9 rounded-full border-2 border-[#FCBF49] object-cover shadow"
                        alt="Avatar seleccionado" />
                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase font-bold tracking-wider text-[#FCBF49]">Seleccionado</span>
                        <span id="modal-selected-avatar-text"
                            class="text-xs text-white/90 font-medium truncate max-w-[170px]">Avatar</span>
                    </div>
                </div>
                <button type="button" id="confirm-avatar-selection-btn"
                    class="px-5 py-2 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-bold text-xs sm:text-sm rounded-full shadow-md hover:scale-105 active:scale-95 transition-all cursor-pointer">
                    Confirmar
                </button>
            </div>

        </div>
    </div>

    <script src="./src/js/auth.js"></script>
    <script src="./src/js/edit_profile.js"></script>
</body>

</html>
