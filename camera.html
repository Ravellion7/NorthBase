<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Camera</title>
    <!-- Google Font: Anton -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<!-- 1. Ensure body has zero margins/padding -->

<body class="bg-white flex flex-col min-h-screen items-center m-0 p-0">
    <!-- 2. Pinned to top (sticky top-0 z-30) and using shadow-xl instead of drop-shadow-xl -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- 1. LEFT: Menu Button & Dropdown -->
            <div class="relative">
                <button id="menu-btn"
                    class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                    aria-label="Abrir Menú">
                    <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                        class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                </button>
                <!-- Dropdown Menu -->
                <div id="menu-dropdown"
                    class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                    <a href="./home.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Home
                    </a>
                    <a href="./trivia_select.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Trivia
                    </a>
                    <a href="./camera.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Cámara
                    </a>
                    <a href="./gallery.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Galería
                    </a>
                    <a href="./teams.html"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Equipos
                    </a>
                </div>
            </div>
            <!-- CENTER: Upside-Down White Pentagon (retains drop-shadow-xl for polygon) -->
            <div class="absolute left-1/2 -translate-x-1/2 top-0 z-20 drop-shadow-xl">
                <a href="./index.html"
                    class="w-20 h-24 sm:w-22 sm:h-26 bg-white flex items-center justify-center pt-1 pb-4 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                    aria-label="Ir al inicio">
                    <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                        class="w-15 h-15 sm:w-17 sm:h-17 object-contain" />
                </a>
            </div>
            <!-- 3. RIGHT: Spacer -->
            <div class="w-10"></div>
        </div>
    </header>

    <!-- MAIN CAMERA SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-25 sm:pt-30 pb-16">

        <!-- Light Gray Camera Container -->
        <div
            class="relative w-full max-w-sm sm:max-w-md h-[520px] sm:h-[580px] bg-slate-200 rounded-3xl shadow-xl flex flex-col justify-between items-center p-4 border border-slate-300">

            <!-- "Camera top.png" Image (Covers full container width, sticking out of top) -->
            <div class="absolute -top-8 sm:-top-11 left-0 right-0 w-full flex justify-center z-20">
                <img src="./src/assets/Camera top.png" alt="Camera Top"
                    class="w-full h-auto object-contain drop-shadow-md" />
            </div>

            <!-- LEFT SIDE VERTICAL CONTROLS (4 Circles + Cerrar) -->
            <div
                class="absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 flex flex-col items-center gap-2.5 sm:gap-3 z-20">

                <!-- Vertical Circle 1 (Top - Slightly Bigger) -->
                <button type="button"
                    class="w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-white/90 border-2 border-slate-400 shadow-md hover:scale-105 active:scale-95 transition-all cursor-pointer">
                </button>

                <!-- Vertical Circle 2 -->
                <button type="button"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/80 border-2 border-slate-400 shadow-sm hover:scale-105 active:scale-95 transition-all cursor-pointer">
                </button>

                <!-- Vertical Circle 3 -->
                <button type="button"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/80 border-2 border-slate-400 shadow-sm hover:scale-105 active:scale-95 transition-all cursor-pointer">
                </button>

                <!-- Vertical Circle 4 -->
                <button type="button"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/80 border-2 border-slate-400 shadow-sm hover:scale-105 active:scale-95 transition-all cursor-pointer">
                </button>

                <!-- "Cerrar" with Icon (Below bottom circle) -->
                <a href="./home.html"
                    class="flex items-center gap-1.5 text-slate-700 hover:text-black font-['Poppins',sans-serif] text-xs font-semibold mt-1 transition-colors cursor-pointer"
                    aria-label="Cerrar cámara">
                    <img src="./src/assets/cerrar icon.png" alt="Cerrar"
                        class="w-3.5 h-3.5 sm:w-4 sm:h-4 object-contain" />
                    <span>Cerrar</span>
                </a>

            </div>

            <!-- Viewfinder Center Placeholder -->
            <div class="flex-1 flex items-center justify-center">
                <span class="text-slate-400 font-['Poppins',sans-serif] text-sm sm:text-base font-semibold">
                    Vista previa de la cámara
                </span>
            </div>

            <!-- 5 Bottom Filter Circles -->
            <div class="w-full pb-4 sm:pb-6 flex items-center justify-center gap-2.5 sm:gap-3.5 z-10">

                <!-- Filter 1 (Left Outer) -->
                <button type="button"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/80 border-2 border-slate-400 shadow-sm hover:scale-105 active:scale-95 transition-all cursor-pointer">
                </button>

                <!-- Filter 2 (Left Inner) -->
                <button type="button"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/80 border-2 border-slate-400 shadow-sm hover:scale-105 active:scale-95 transition-all cursor-pointer">
                </button>

                <!-- Filter 3 (Center - Slightly Bigger) -->
                <button type="button"
                    class="w-13 h-13 sm:w-14 sm:h-14 rounded-full bg-white/90 border-2 border-slate-400 shadow-md hover:scale-105 active:scale-95 transition-all cursor-pointer">
                </button>

                <!-- Filter 4 (Right Inner) -->
                <button type="button"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/80 border-2 border-slate-400 shadow-sm hover:scale-105 active:scale-95 transition-all cursor-pointer">
                </button>

                <!-- Filter 5 (Right Outer) -->
                <button type="button"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/80 border-2 border-slate-400 shadow-sm hover:scale-105 active:scale-95 transition-all cursor-pointer">
                </button>

            </div>

        </div>


        <!-- Main Camera Shutter Button (Outside Container at bottom) -->
        <div class="mt-6 sm:mt-8 flex justify-center">
            <button type="button"
                class="w-16 h-16 sm:w-18 sm:h-18 rounded-full bg-white border-4 border-slate-400 shadow-xl hover:bg-slate-50 hover:scale-105 active:scale-95 transition-all cursor-pointer flex items-center justify-center"
                aria-label="Tomar foto">
                <div class="w-12 h-12 sm:w-13 sm:h-13 rounded-full bg-white border border-slate-200"></div>
            </button>
        </div>


    </main>



    <script src="./src/js/index.js"></script>

</body>

</html>
