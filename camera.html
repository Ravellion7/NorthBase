<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Camera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="./src/js/camera.js"></script>



    <style>
        /* Hacer q la cámara de MindAR y el canvas de WebGL estén centrados y llenen el contenedor */
        .mindar-ui-overlay {
            display: none !important;
        }

        .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
        }

        video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            min-width: 100% !important;
            min-height: 100% !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            z-index: 0 !important;
        }
    </style>


</head>

<body class="bg-[#F5F5F5] overflow-x-hidden flex flex-col min-h-screen items-center m-0 p-0">
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between relative h-10 sm:h-12">


            <div class="flex items-center gap-2 sm:gap-3">


                <div class="relative md:hidden">
                    <button id="menu-btn"
                        class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                        aria-label="Abrir Menú">
                        <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                            class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                    </button>

                    <div id="menu-dropdown"
                        class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                        <a href="./home.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Home
                        </a>
                        <a href="./trivia_select.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Trivia
                        </a>
                        <a href="./camera.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Cámara
                        </a>
                        <a href="./gallery.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Galería
                        </a>
                        <a href="./teams.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Equipos
                        </a>
                    </div>
                </div>


                <a href="./game.html"
                    class="w-9 h-9 sm:w-10 sm:h-10 overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shrink-0 p-1"
                    aria-label="Ir al juego de cartas">
                    <img src="./src/assets/cards icon.png" alt="Juego de Cartas" class="w-full h-full object-contain" />
                </a>

            </div>

            <div
                class="flex items-center gap-6 sm:gap-8 md:gap-8 lg:gap-12 absolute left-1/2 -translate-x-1/2 top-0 h-full z-20">


                <a href="./trivia_select.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Trivia
                </a>


                <a href="./camera.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Cámara
                </a>


                <div class="drop-shadow-xl self-start">
                    <a href="./home.html"
                        class="w-20 h-24 sm:w-24 sm:h-28 md:w-36 md:h-44 lg:w-40 lg:h-48 bg-white flex items-center justify-center pt-1 pb-4 md:pt-3 md:pb-8 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                        aria-label="Ir al inicio">
                        <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                            class="w-15 h-15 sm:w-18 sm:h-18 md:w-28 md:h-28 lg:w-32 lg:h-32 object-contain" />
                    </a>
                </div>

                <a href="./gallery.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Galería
                </a>


                <a href="./teams.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Equipos
                </a>
            </div>


            <a href="./profile.html"
                class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-white overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shadow-md bg-white shrink-0"
                aria-label="Ir al perfil">
                <img src="./src/assets/default profile.png" alt="Perfil" class="w-full h-full object-cover" />
            </a>

        </div>
    </header>


    <main class="w-full flex-1 flex flex-col items-center justify-start p-0 m-0 overflow-hidden">


        <div
            class="relative w-full h-[calc(100vh-64px)] sm:h-[calc(100vh-72px)] bg-black rounded-none shadow-none flex flex-col justify-between items-center p-4 md:p-8 border-0 overflow-hidden">


            <div
                class="absolute top-3 md:top-4 left-1/2 -translate-x-1/2 w-48 sm:w-60 md:w-80 lg:w-96 flex justify-center z-20 pointer-events-none">
                <img src="./src/assets/Camera top.png" alt="Camera Top"
                    class="w-full h-auto object-contain drop-shadow-md" />
            </div>

            <div
                class="absolute left-3 sm:left-4 md:left-6 top-1/2 -translate-y-1/2 flex flex-col items-center gap-2.5 sm:gap-3 md:gap-4 z-20">

                <!-- Botón 1: Confetti -->
                <button type="button" data-particle-effect="confetti" title="Confetti"
                    class="particle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-black/40 backdrop-blur-sm border-[3px] border-white shadow-lg hover:scale-110 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center p-1.5">
                    <img src="./src/assets/confetti icon.png" alt="Confetti"
                        class="w-full h-full object-contain pointer-events-none drop-shadow" />
                </button>

                <!-- Botón 2: Fuego -->
                <button type="button" data-particle-effect="fire" title="Fuego"
                    class="particle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-black/40 backdrop-blur-sm border-[3px] border-white shadow-lg hover:scale-110 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center p-1.5">
                    <img src="./src/assets/fire icon.png" alt="Fuego"
                        class="w-full h-full object-contain pointer-events-none drop-shadow" />
                </button>

                <!-- Botón 3: Estrellas / Sparkles -->
                <button type="button" data-particle-effect="sparkles" title="Brillos Dorados"
                    class="particle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-black/40 backdrop-blur-sm border-[3px] border-white shadow-lg hover:scale-110 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center p-1.5">
                    <img src="./src/assets/sparkles icon.png" alt="Sparkles"
                        class="w-full h-full object-contain pointer-events-none drop-shadow" />
                </button>

                <!-- Botón 4: Rayos / Electricidad -->
                <button type="button" data-particle-effect="lightning" title="Rayos Eléctricos"
                    class="particle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-black/40 backdrop-blur-sm border-[3px] border-white shadow-lg hover:scale-110 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center p-1.5">
                    <img src="./src/assets/lightning icon.png" alt="Rayos"
                        class="w-full h-full object-contain pointer-events-none drop-shadow" />
                </button>

                <a href="./home.html"
                    class="flex items-center gap-1.5 text-white/90 hover:text-white font-['Poppins',sans-serif] text-xs sm:text-sm font-semibold mt-1 transition-colors cursor-pointer drop-shadow-md"
                    aria-label="Cerrar cámara">
                    <img src="./src/assets/cerrar icon.png" alt="Cerrar"
                        class="w-3.5 h-3.5 sm:w-4 sm:h-4 object-contain brightness-200" />
                    <span>Cerrar</span>
                </a>

            </div>

            <div class="absolute inset-0 w-full h-full overflow-hidden z-0">
                <a-scene
                    mindar-image="imageTargetSrc: ./src/assets/targets.mind; filterMinCF:0.001; filterBeta: 0.01; uiLoading: no; uiScanning: no; warmupTolerance: 5; missTolerance: 5;"
                    color-space="sRGB" renderer="colorManagement: true;" vr-mode-ui="enabled: false"
                    device-orientation-permission-ui="enabled: false" class="w-full h-full" embedded>

                    <a-assets>
                        <a-asset-item id="acererosModel" src="./src/assets/Models/Acereros.glb"></a-asset-item>
                        <a-asset-item id="algodonerosModel" src="./src/assets/Models/Algodoneros.glb"></a-asset-item>
                        <a-asset-item id="calientesModel" src="./src/assets/Models/Calientes.glb"></a-asset-item>
                        <a-asset-item id="charrosModel" src="./src/assets/Models/Charros.glb"></a-asset-item>
                        <a-asset-item id="doradosModel" src="./src/assets/Models/Dorados.glb"></a-asset-item>
                        <a-asset-item id="rielerosModel" src="./src/assets/Models/Rieleros.glb"></a-asset-item>
                        <a-asset-item id="saraperosModel" src="./src/assets/Models/Saraperos.glb"></a-asset-item>
                        <a-asset-item id="sultanesModel" src="./src/assets/Models/Sultanes w anims.glb"></a-asset-item>
                        <a-asset-item id="tecosModel" src="./src/assets/Models/Tecos.glb"></a-asset-item>
                        <a-asset-item id="torosModel" src="./src/assets/Models/Toros.glb"></a-asset-item>
                    </a-assets>

                    <a-camera position="0 0 0" look-controls="enabled: false">
                        <a-light type="directional" color="#ffffff" intensity="2" position="0 0 1"></a-light>
                        <a-light type="ambient" color="#ffffff" intensity="1.8"></a-light>
                    </a-camera>


                    <a-entity class="team-target" data-team="Acereros" mindar-image-target="targetIndex: 0">
                        <a-gltf-model src="#acererosModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="0 0 0"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                        </a-gltf-model>
                    </a-entity>


                    <a-entity class="team-target" data-team="Algodoneros" mindar-image-target="targetIndex: 1">
                        <a-gltf-model src="#algodonerosModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="0 0 0"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                        </a-gltf-model>
                    </a-entity>

                    <a-entity class="team-target" data-team="Calientes" mindar-image-target="targetIndex: 2">
                        <a-gltf-model src="#calientesModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="0 0 0"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                        </a-gltf-model>
                    </a-entity>

                    <a-entity class="team-target" data-team="Charros" mindar-image-target="targetIndex: 3">
                        <a-gltf-model src="#charrosModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="0 0 0"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                        </a-gltf-model>
                    </a-entity>

                    <a-entity class="team-target" data-team="Dorados" mindar-image-target="targetIndex: 4">
                        <a-gltf-model src="#doradosModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="0 0 0"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                        </a-gltf-model>
                    </a-entity>

                    <a-entity class="team-target" data-team="Rieleros" mindar-image-target="targetIndex: 5">
                        <a-gltf-model src="#rielerosModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="0 0 0"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                        </a-gltf-model>
                    </a-entity>

                    <a-entity class="team-target" data-team="Saraperos" mindar-image-target="targetIndex: 6">
                        <a-gltf-model src="#saraperosModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="0 0 0"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                        </a-gltf-model>
                    </a-entity>

                    <a-entity class="team-target" data-team="Sultanes" mindar-image-target="targetIndex: 7">
                        <a-gltf-model id="sultanesGltf" src="#sultanesModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0">
                        </a-gltf-model>
                    </a-entity>

                    <a-entity class="team-target" data-team="Tecos" mindar-image-target="targetIndex: 8">
                        <a-gltf-model src="#tecosModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="0 0 0"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                        </a-gltf-model>
                    </a-entity>

                    <a-entity class="team-target" data-team="Toros" mindar-image-target="targetIndex: 9">
                        <a-gltf-model src="#torosModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="0 0 0"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                        </a-gltf-model>
                    </a-entity>
                </a-scene>

                <div id="camera-status"
                    class="absolute top-20 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-sm border border-white/20 px-4 py-1.5 rounded-full text-white text-xs sm:text-sm font-['Poppins',sans-serif] pointer-events-none z-20 transition-opacity duration-300">
                    Apunta la cámara al logo de un equipo...
                </div>
            </div>


            <div
                class="absolute bottom-4 sm:bottom-6 md:bottom-8 left-0 right-0 flex items-center justify-center gap-2.5 sm:gap-3.5 z-10">

                <!-- Animación 1 (ej. Bat / Hit) -->
                <button type="button" data-anim-index="0" title="Animación 1"
                    class="camera-anim-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white text-xs font-bold">
                    1
                </button>

                <!-- Animación 2 (ej. Pitch) -->
                <button type="button" data-anim-index="1" title="Animación 2"
                    class="camera-anim-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white text-xs font-bold">
                    2
                </button>

                <!-- Animación 3 (ej. Hit) -->
                <button type="button" data-anim-index="2" title="Animación 3"
                    class="camera-anim-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white text-xs font-bold">
                    3
                </button>

                <!-- Detener / Idle -->
                <button type="button" data-anim-index="stop" title="Detener / Idle"
                    class="camera-anim-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white text-xs font-bold">
                    ■
                </button>

            </div>


        </div>

    </main>



    <script src="./src/js/index.js"></script>

</body>

</html>
