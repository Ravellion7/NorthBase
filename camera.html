<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Camera</title>
    <!-- Google Font: Anton -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<!-- 1. Ensure body has zero margins/padding -->

<body class="bg-[#F5F5F5] overflow-x-hidden flex flex-col min-h-screen items-center m-0 p-0">
    <!-- 2. HEADER (Responsive: Mobile Menu vs Desktop Navigation) -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between relative h-10 sm:h-12">

            <!-- LEFT: Mobile Hamburger Menu & Desktop Balancer -->
            <div class="flex items-center">
                <!-- Mobile Hamburger (Hidden on Desktop) -->
                <div class="relative md:hidden">
                    <button id="menu-btn"
                        class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                        aria-label="Abrir Menú">
                        <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                            class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="menu-dropdown"
                        class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                        <a href="./home.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Home
                        </a>
                        <a href="./trivia_select.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Trivia
                        </a>
                        <a href="./camera.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Cámara
                        </a>
                        <a href="./gallery.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Galería
                        </a>
                        <a href="./teams.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Equipos
                        </a>
                    </div>
                </div>

                <!-- Desktop Balancer to match the right profile picture -->
                <div class="hidden md:block w-9 sm:w-10"></div>
            </div>

            <!-- 2. CENTER: Navigation (Desktop "Trivia" & "Cámara" - Pentagon Logo - "Galería" & "Equipos") -->
            <div
                class="flex items-center gap-6 sm:gap-8 md:gap-8 lg:gap-12 absolute left-1/2 -translate-x-1/2 top-0 h-full z-20">

                <!-- Desktop "Trivia" Link -->
                <a href="./trivia_select.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Trivia
                </a>

                <!-- Desktop "Cámara" Link -->
                <a href="./camera.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Cámara
                </a>

                <!-- Center Pentagon Logo (Considerably Larger Size) -->
                <div class="drop-shadow-xl self-start">
                    <a href="./home.html"
                        class="w-20 h-24 sm:w-24 sm:h-28 md:w-36 md:h-44 lg:w-40 lg:h-48 bg-white flex items-center justify-center pt-1 pb-4 md:pt-3 md:pb-8 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                        aria-label="Ir al inicio">
                        <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                            class="w-15 h-15 sm:w-18 sm:h-18 md:w-28 md:h-28 lg:w-32 lg:h-32 object-contain" />
                    </a>
                </div>



                <!-- Desktop "Galería" Link -->
                <a href="./gallery.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Galería
                </a>

                <!-- Desktop "Equipos" Link -->
                <a href="./teams.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Equipos
                </a>
            </div>

            <!-- 3. RIGHT: Profile Button (Takes you to profile.html) -->
            <a href="./profile.html"
                class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-white overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shadow-md bg-white shrink-0"
                aria-label="Ir al perfil">
                <img src="./src/assets/default profile.png" alt="Perfil" class="w-full h-full object-cover" />
            </a>

        </div>
    </header>

    <!-- MAIN CAMERA SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-12 sm:pt-14 md:pt-16 lg:pt-18 pb-16">


        <!-- Light Gray Camera Container (80vw x 80vh on Desktop) -->
        <div
            class="relative w-full max-w-sm sm:max-w-md md:w-[94vw] lg:w-[95vw] md:max-w-none h-[520px] sm:h-[580px] md:h-[80vh] bg-slate-200 rounded-3xl shadow-2xl flex flex-col justify-between items-center p-4 md:p-8 border border-slate-300">

            <!-- "Camera top.png" Image (Reverted back to previous size, centered) -->
            <div
                class="absolute -top-7 sm:-top-9 md:-top-11 lg:-top-13 left-1/2 -translate-x-1/2 w-full max-w-sm sm:max-w-md md:max-w-xl lg:max-w-2xl flex justify-center z-20 pointer-events-none">
                <img src="./src/assets/Camera top.png" alt="Camera Top"
                    class="w-full h-auto object-contain drop-shadow-md" />
            </div>

            <!-- LEFT SIDE VERTICAL CONTROLS (4 Circles + Cerrar) -->
            <div
                class="absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 flex flex-col items-center gap-2.5 sm:gap-3 z-20">

                <!-- Vertical Circle 1 -->
                <button type="button"
                    class="camera-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Vertical Circle 2 -->
                <button type="button"
                    class="camera-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Vertical Circle 3 -->
                <button type="button"
                    class="camera-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Vertical Circle 4 -->
                <button type="button"
                    class="camera-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- "Cerrar" with Icon (Below bottom circle) -->
                <a href="./home.html"
                    class="flex items-center gap-1.5 text-white/90 hover:text-white font-['Poppins',sans-serif] text-xs font-semibold mt-1 transition-colors cursor-pointer drop-shadow-md"
                    aria-label="Cerrar cámara">
                    <img src="./src/assets/cerrar icon.png" alt="Cerrar"
                        class="w-3.5 h-3.5 sm:w-4 sm:h-4 object-contain brightness-200" />
                    <span>Cerrar</span>
                </a>

            </div>

            <!-- Camera Viewfinder (Live Video Feed) -->
            <div
                class="absolute inset-0 w-full h-full rounded-3xl overflow-hidden bg-black flex items-center justify-center z-0">
                <video id="camera-stream" autoplay playsinline muted class="w-full h-full object-cover -scale-x-100">
                </video>

                <!-- Fallback message if camera access is blocked or loading -->
                <p id="camera-status"
                    class="absolute text-white/70 font-['Poppins',sans-serif] text-sm sm:text-base font-medium text-center px-4">
                    Iniciando cámara...
                </p>
            </div>


            <!-- 5 Bottom Filter Circles (Pinned to Bottom) -->
            <div
                class="absolute bottom-4 sm:bottom-6 md:bottom-8 left-0 right-0 flex items-center justify-center gap-2.5 sm:gap-3.5 z-10">

                <!-- Filter 1 (Left Outer) -->
                <button type="button"
                    class="camera-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Filter 2 (Left Inner) -->
                <button type="button"
                    class="camera-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Filter 3 (Center) -->
                <button type="button"
                    class="camera-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Filter 4 (Right Inner) -->
                <button type="button"
                    class="camera-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

                <!-- Filter 5 (Right Outer) -->
                <button type="button"
                    class="camera-circle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer">
                </button>

            </div>


        </div>


    </main>



    <script src="./src/js/index.js"></script>
    <script src="./src/js/camera.js"></script>

</body>

</html>
