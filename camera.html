<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Camera</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./src/assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./src/assets/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="./src/assets/favicon_io/favicon.ico">
    <link rel="manifest" href="./src/assets/favicon_io/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="./src/js/auth.js"></script>
    <script src="./src/js/camera.js"></script>



    <style>
        /* Ocultar interfaces por defecto de MindAR y botón de VR de A-Frame */
        .mindar-ui-overlay,
        .a-enter-vr,
        .a-enter-vr-button,
        .a-enter-ar,
        .a-enter-ar-button,
        [data-a-enter-vr-button] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
        }

        video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            min-width: 100% !important;
            min-height: 100% !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            z-index: 0 !important;
        }
    </style>


</head>

<body class="bg-[#0A1A32] overflow-hidden flex flex-col h-[100dvh] w-full m-0 p-0 fixed inset-0">
    <header class="sticky top-0 z-30 w-full shrink-0 bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between relative h-10 sm:h-12">


            <div class="flex items-center gap-2 sm:gap-3">


                <div class="relative md:hidden">
                    <button id="menu-btn"
                        class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                        aria-label="Abrir Menú">
                        <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                            class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                    </button>

                    <div id="menu-dropdown"
                        class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                        <a href="./home.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Home
                        </a>
                        <a href="./trivia_select.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Trivia
                        </a>
                        <a href="./camera.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Cámara
                        </a>
                        <a href="./gallery.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Galería
                        </a>
                        <a href="./teams.html"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Equipos
                        </a>
                    </div>
                </div>


                <a href="./game.html"
                    class="w-9 h-9 sm:w-10 sm:h-10 overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shrink-0 p-1"
                    aria-label="Ir al juego de cartas">
                    <img src="./src/assets/cards icon.png" alt="Juego de Cartas" class="w-full h-full object-contain" />
                </a>

            </div>

            <div
                class="flex items-center gap-6 sm:gap-8 md:gap-8 lg:gap-12 absolute left-1/2 -translate-x-1/2 top-0 h-full z-20">


                <a href="./trivia_select.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Trivia
                </a>


                <a href="./camera.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Cámara
                </a>


                <div class="drop-shadow-xl self-start">
                    <a href="./home.html"
                        class="w-20 h-24 sm:w-24 sm:h-28 md:w-36 md:h-44 lg:w-40 lg:h-48 bg-white flex items-center justify-center pt-1 pb-4 md:pt-3 md:pb-8 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                        aria-label="Ir al inicio">
                        <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                            class="w-15 h-15 sm:w-18 sm:h-18 md:w-28 md:h-28 lg:w-32 lg:h-32 object-contain" />
                    </a>
                </div>

                <a href="./gallery.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Galería
                </a>


                <a href="./teams.html"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Equipos
                </a>
            </div>


            <a href="./profile.html"
                class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-white overflow-hidden hover:opacity-90 hover:scale-105 transition-all flex items-center justify-center cursor-pointer shadow-md bg-white shrink-0"
                aria-label="Ir al perfil">
                <img src="./src/assets/default profile.png" alt="Perfil" class="w-full h-full object-cover" />
            </a>

        </div>
    </header>


    <main class="w-full flex-1 relative flex flex-col items-center justify-start p-0 m-0 overflow-hidden">


        <div
            class="relative w-full h-full bg-black rounded-none shadow-none flex flex-col justify-between items-center p-3 sm:p-4 md:p-8 border-0 overflow-hidden">


            <div
                class="absolute top-0 left-1/2 -translate-x-1/2 w-48 sm:w-60 md:w-80 lg:w-96 flex justify-center z-20 pointer-events-none">
                <img src="./src/assets/Camera top.png" alt="Camera Top"
                    class="w-full h-auto object-contain drop-shadow-md" />
            </div>

            <!-- Botón de Información / Guía de la Cámara AR -->
            <button type="button" id="camera-info-btn" title="¿Cómo usar la Cámara AR?"
                class="absolute top-3 md:top-4 left-3 sm:left-4 md:left-6 w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white border-2 border-white shadow-xl hover:scale-110 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center p-0.5 z-20 hover:ring-2 hover:ring-white/80"
                aria-label="Abrir guía de ayuda">
                <img src="./src/assets/info icon.png" alt="Información"
                    class="w-full h-full object-contain pointer-events-none" />
            </button>

            <div
                class="absolute left-3 sm:left-4 md:left-6 top-1/2 -translate-y-1/2 flex flex-col items-center gap-2.5 sm:gap-3 md:gap-4 z-20">

                <div id="particle-buttons-container"
                    class="flex flex-col items-center gap-2.5 sm:gap-3 md:gap-4 transition-all duration-300">
                    <!-- Botón 1: Confetti -->
                    <button type="button" data-particle-effect="confetti" title="Confetti"
                        class="particle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-black/40 backdrop-blur-sm border-[3px] border-white shadow-lg hover:scale-110 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center p-1.5">
                        <img src="./src/assets/confetti icon.png" alt="Confetti"
                            class="w-full h-full object-contain pointer-events-none drop-shadow" />
                    </button>

                    <!-- Botón 2: Fuego -->
                    <button type="button" data-particle-effect="fire" title="Fuego"
                        class="particle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-black/40 backdrop-blur-sm border-[3px] border-white shadow-lg hover:scale-110 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center p-1.5">
                        <img src="./src/assets/fire icon.png" alt="Fuego"
                            class="w-full h-full object-contain pointer-events-none drop-shadow" />
                    </button>

                    <!-- Botón 3: Estrellas / Sparkles -->
                    <button type="button" data-particle-effect="sparkles" title="Brillos Dorados"
                        class="particle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-black/40 backdrop-blur-sm border-[3px] border-white shadow-lg hover:scale-110 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center p-1.5">
                        <img src="./src/assets/sparkles icon.png" alt="Sparkles"
                            class="w-full h-full object-contain pointer-events-none drop-shadow" />
                    </button>

                    <!-- Botón 4: Rayos / Electricidad -->
                    <button type="button" data-particle-effect="lightning" title="Rayos Eléctricos"
                        class="particle-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-black/40 backdrop-blur-sm border-[3px] border-white shadow-lg hover:scale-110 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center p-1.5">
                        <img src="./src/assets/lightning icon.png" alt="Rayos"
                            class="w-full h-full object-contain pointer-events-none drop-shadow" />
                    </button>
                </div>

                <!-- Botón para ocultar / mostrar opciones de partículas -->
                <button type="button" id="toggle-particles-btn"
                    class="flex items-center gap-1.5 text-white/90 hover:text-white font-['Poppins',sans-serif] text-xs sm:text-sm font-semibold mt-1 transition-all cursor-pointer drop-shadow-md bg-black/40 hover:bg-black/60 px-3 py-1.5 rounded-full border border-white/30 hover:border-white shadow active:scale-95"
                    aria-label="Ocultar o mostrar opciones de partículas">
                    <img id="toggle-particles-icon" src="./src/assets/cerrar icon.png" alt="Toggle"
                        class="w-3.5 h-3.5 sm:w-4 sm:h-4 object-contain brightness-200 transition-transform duration-200" />
                    <span id="toggle-particles-text">Cerrar</span>
                </button>

            </div>

            <!-- Flash visual para la foto -->
            <div id="shutter-flash"
                class="absolute inset-0 bg-white pointer-events-none opacity-0 transition-opacity duration-150 z-50">
            </div>

            <!-- Indicador y Contador de Grabación de Video (REC) -->
            <div id="recording-indicator"
                class="absolute top-4 sm:top-5 left-1/2 -translate-x-1/2 bg-red-600/90 text-white font-['Poppins',sans-serif] px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold shadow-xl border border-red-300 z-30 hidden items-center gap-2 tracking-wide">
                <span> <span id="recording-time-text">00:00</span> / 00:15</span>
            </div>


            <div class="absolute inset-0 w-full h-full overflow-hidden z-0">
                <a-scene
                    mindar-image="imageTargetSrc: ./src/assets/targets.mind; filterMinCF:0.001; filterBeta: 0.01; uiLoading: no; uiScanning: no; warmupTolerance: 5; missTolerance: 5;"
                    color-space="sRGB" renderer="colorManagement: true; preserveDrawingBuffer: true;"
                    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" class="w-full h-full"
                    embedded>

                    <a-assets>
                        <a-asset-item id="acererosModel" src="./src/assets/Models/Acereros.glb"></a-asset-item>
                        <a-asset-item id="algodonerosModel" src="./src/assets/Models/Algodoneros.glb"></a-asset-item>
                        <a-asset-item id="calientesModel" src="./src/assets/Models/Calientes.glb"></a-asset-item>
                        <a-asset-item id="charrosModel" src="./src/assets/Models/Charros.glb"></a-asset-item>
                        <a-asset-item id="doradosModel" src="./src/assets/Models/Dorados.glb"></a-asset-item>
                        <a-asset-item id="rielerosModel" src="./src/assets/Models/Rieleros.glb"></a-asset-item>
                        <a-asset-item id="saraperosModel" src="./src/assets/Models/Saraperos.glb"></a-asset-item>
                        <a-asset-item id="sultanesModel" src="./src/assets/Models/Sultanes w anims.glb"></a-asset-item>
                        <a-asset-item id="tecosModel" src="./src/assets/Models/Tecos.glb"></a-asset-item>
                        <a-asset-item id="torosModel" src="./src/assets/Models/Toros.glb"></a-asset-item>
                    </a-assets>

                    <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse"
                        raycaster="objects: .clickable">
                        <a-light type="directional" color="#ffffff" intensity="2" position="0 0 1"></a-light>
                        <a-light type="ambient" color="#ffffff" intensity="1.8"></a-light>
                    </a-camera>


                    <a-entity class="team-target clickable" data-team="Acereros" mindar-image-target="targetIndex: 0">
                        <a-gltf-model class="clickable" src="#acererosModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>


                    <a-entity class="team-target clickable" data-team="Algodoneros"
                        mindar-image-target="targetIndex: 1">
                        <a-gltf-model class="clickable" src="#algodonerosModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>

                    <a-entity class="team-target clickable" data-team="Calientes" mindar-image-target="targetIndex: 2">
                        <a-gltf-model class="clickable" src="#calientesModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>

                    <a-entity class="team-target clickable" data-team="Charros" mindar-image-target="targetIndex: 3">
                        <a-gltf-model class="clickable" src="#charrosModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>

                    <a-entity class="team-target clickable" data-team="Dorados" mindar-image-target="targetIndex: 4">
                        <a-gltf-model class="clickable" src="#doradosModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>

                    <a-entity class="team-target clickable" data-team="Rieleros" mindar-image-target="targetIndex: 5">
                        <a-gltf-model class="clickable" src="#rielerosModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>

                    <a-entity class="team-target clickable" data-team="Saraperos" mindar-image-target="targetIndex: 6">
                        <a-gltf-model class="clickable" src="#saraperosModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>

                    <a-entity class="team-target clickable" data-team="Sultanes" mindar-image-target="targetIndex: 7">
                        <a-gltf-model id="sultanesGltf" class="clickable" src="#sultanesModel" position="0 0 0.1"
                            scale="0.5 0.5 0.5" rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>

                    <a-entity class="team-target clickable" data-team="Tecos" mindar-image-target="targetIndex: 8">
                        <a-gltf-model class="clickable" src="#tecosModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>

                    <a-entity class="team-target clickable" data-team="Toros" mindar-image-target="targetIndex: 9">
                        <a-gltf-model class="clickable" src="#torosModel" position="0 0 0.1" scale="0.5 0.5 0.5"
                            rotation="0 0 0"></a-gltf-model>
                        <a-box class="clickable team-hitbox" position="0 0.2 0.1" scale="0.85 1.1 0.85"
                            material="opacity: 0; transparent: true"></a-box>
                    </a-entity>
                </a-scene>

                <div id="camera-status"
                    class="absolute top-3 sm:top-4 right-3 sm:right-4 md:right-6 max-w-[280px] sm:max-w-xs bg-black/60 backdrop-blur-sm border border-white/20 px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-2xl sm:rounded-full text-white text-xs sm:text-sm font-['Poppins',sans-serif] pointer-events-none z-20 transition-all duration-300 text-center shadow-lg select-none">
                    Apunta la cámara al logo de un equipo...
                </div>
            </div>


            <div
                class="absolute bottom-6 sm:bottom-8 md:bottom-10 left-0 right-0 flex items-center justify-center gap-2 sm:gap-3.5 z-10 px-2 pb-[env(safe-area-inset-bottom)]">

                <!-- Animación 1 (ej. Bat / Hit) -->
                <button type="button" data-anim-index="0" title="Animación 1"
                    class="camera-anim-btn w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white text-xs font-bold">
                    1
                </button>

                <!-- Animación 2 (ej. Pitch) -->
                <button type="button" data-anim-index="1" title="Animación 2"
                    class="camera-anim-btn w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white text-xs font-bold">
                    2
                </button>

                <!-- Animación 3 (ej. Hit) -->
                <button type="button" data-anim-index="2" title="Animación 3"
                    class="camera-anim-btn w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white text-xs font-bold">
                    3
                </button>

                <!-- Detener / Idle -->
                <button type="button" data-anim-index="stop" title="Detener / Idle"
                    class="camera-anim-btn w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-transparent border-[3px] border-white shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white text-xs font-bold">
                    ■
                </button>

                <!-- Botón de Captura (Foto o Video) -->
                <button type="button" id="capture-btn" title="Tomar Foto"
                    class="w-12 h-12 sm:w-14 sm:h-14 ml-1.5 sm:ml-3 rounded-full bg-white/20 border-[3px] border-white shadow-lg hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white relative">
                    <!-- Icono Foto -->
                    <svg id="capture-photo-icon" xmlns="http://www.w3.org/2000/svg"
                        class="w-5 h-5 sm:w-6 sm:h-6 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                        <path
                            d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h4.05l1.83-2h4.24l1.83 2H20v12z" />
                    </svg>
                    <!-- Punto rojo para Modo Video (inactivo) -->
                    <div id="capture-video-dot"
                        class="w-6 h-6 rounded-full bg-red-600 border-2 border-white hidden transition-all shadow-md">
                    </div>
                    <!-- Cuadro blanco para Detener Grabación (activo) -->
                    <div id="capture-stop-box" class="w-5 h-5 rounded-sm bg-white hidden animate-pulse"></div>
                </button>

                <!-- Botón Alternar Modo (Foto / Video) -->
                <button type="button" id="camera-mode-toggle" title="Cambiar a Modo Video"
                    class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-black/40 backdrop-blur-sm border-[2.5px] border-white shadow-md hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center text-white p-2">
                    <!-- Icono para cambiar a Video -->
                    <svg id="toggle-video-icon" xmlns="http://www.w3.org/2000/svg" class="w-full h-full fill-current"
                        viewBox="0 0 24 24">
                        <path
                            d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z" />
                    </svg>
                    <!-- Icono para cambiar a Foto -->
                    <svg id="toggle-photo-icon" xmlns="http://www.w3.org/2000/svg"
                        class="w-full h-full fill-current hidden" viewBox="0 0 24 24">
                        <path
                            d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                        <path
                            d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h4.05l1.83-2h4.24l1.83 2H20v12z" />
                    </svg>
                </button>

            </div>


        </div>

    </main>

    <!-- Modal Interactivo: Guía de uso de la Cámara AR -->
    <div id="camera-guide-modal"
        class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">

        <div
            class="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col p-6 sm:p-8 font-['Poppins',sans-serif] text-slate-800 transition-all">

            <!-- Botón Cerrar (✕) -->
            <button id="guide-close-btn" type="button"
                class="absolute top-4 right-4 sm:top-5 sm:right-5 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center text-lg font-bold transition cursor-pointer"
                aria-label="Cerrar guía">
                ✕
            </button>

            <!-- Encabezado y Badge de Progreso -->
            <div class="flex items-center gap-2 mb-3">
                <span id="guide-step-badge"
                    class="bg-red-50 text-[#C1121F] border border-red-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                    Paso 1 de 5
                </span>
                <span class="text-xs text-slate-400 font-medium">Guía de la Cámara</span>
            </div>

            <!-- Contenido dinámico del Paso -->
            <div id="guide-step-container" class="min-h-[220px] flex flex-col justify-center">
                <!-- Se inyecta dinámicamente vía JS -->
            </div>

            <!-- Navegación Inferior -->
            <div class="flex items-center justify-between mt-6 pt-4 border-t border-slate-100">
                <!-- Indicador de Puntos (Dots) -->
                <div id="guide-dots-container" class="flex items-center gap-1.5">
                    <!-- Dots generados por JS -->
                </div>

                <!-- Botones de Acción -->
                <div class="flex items-center gap-2 sm:gap-3">
                    <button id="guide-prev-btn" type="button"
                        class="px-3.5 sm:px-4 py-2 rounded-full text-slate-500 hover:text-slate-800 hover:bg-slate-100 font-semibold text-xs sm:text-sm transition cursor-pointer hidden">
                        Anterior
                    </button>
                    <button id="guide-next-btn" type="button"
                        class="px-5 sm:px-6 py-2 rounded-full bg-[#C1121F] hover:bg-red-700 text-white font-semibold text-xs sm:text-sm shadow-md hover:shadow-lg transition cursor-pointer flex items-center gap-1.5 active:scale-95">
                        <span id="guide-next-text">Next</span>
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                            <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42L16.86 11H5v2z" />
                        </svg>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script src="./src/js/index.js"></script>

</body>
