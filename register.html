<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-[#F5F5F5] overflow-x-hidden flex flex-col min-h-screen items-center m-0 p-0">

    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between relative h-10 sm:h-12">


            <div class="flex items-center">

                <div class="relative md:hidden">
                    <button id="menu-btn"
                        class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                        aria-label="Abrir Menú">
                        <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                            class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                    </button>

                    <div id="menu-dropdown"
                        class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                        <a href="index.html#home"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Home
                        </a>
                        <a href="index.html#nosotros"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Nosotros
                        </a>
                        <a href="index.html#conoce"
                            class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                            Conoce
                        </a>
                    </div>
                </div>


                <div class="hidden md:block w-28 lg:w-36"></div>
            </div>


            <div
                class="flex items-center gap-8 md:gap-12 lg:gap-16 absolute left-1/2 -translate-x-1/2 top-0 h-full z-20">


                <a href="index.html#conoce"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Conoce
                </a>


                <div class="drop-shadow-xl self-start">
                    <a href="./home.html"
                        class="w-20 h-24 sm:w-24 sm:h-28 md:w-36 md:h-44 lg:w-40 lg:h-48 bg-white flex items-center justify-center pt-1 pb-4 md:pt-3 md:pb-8 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)] hover:opacity-95 transition-opacity cursor-pointer block"
                        aria-label="Ir al inicio">
                        <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                            class="w-15 h-15 sm:w-18 sm:h-18 md:w-28 md:h-28 lg:w-32 lg:h-32 object-contain" />
                    </a>
                </div>


                <a href="index.html#nosotros"
                    class="hidden md:flex items-center h-full text-white hover:text-[#C1121F] font-['Poppins',sans-serif] font-semibold text-sm lg:text-base transition-colors tracking-wide">
                    Nosotros
                </a>
            </div>


            <div class="flex items-center justify-end w-10 md:w-28 lg:w-36">
                <a href="login.html"
                    class="hidden md:inline-block px-5 py-2 lg:px-6 lg:py-2.5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-semibold text-xs sm:text-sm rounded-full shadow-md hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-200 text-center tracking-wide whitespace-nowrap">
                    ¡Comienza ya!
                </a>
            </div>

        </div>
    </header>


    <main class="w-full flex-1 flex flex-col items-center justify-center p-4 sm:p-6 md:p-10">


        <div class="w-full max-w-[290px] sm:max-w-xs flex flex-col items-center md:hidden pt-8 pb-16">

            <div class="flex justify-center mb-8">
                <img src="./src/assets/ACCOUNT.png" alt="Create Your Account"
                    class="w-56 sm:w-72 h-auto object-contain drop-shadow-sm" />
            </div>

            <!-- Registration Form -->
            <form action="./login.html" method="GET" class="w-full flex flex-col gap-4 bg-transparent p-0">

                <input type="text" name="name" autocomplete="given-name" placeholder="Nombre(s)" aria-label="Nombre(s)"
                    required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />


                <input type="text" name="father_last_name" autocomplete="family-name" placeholder="Apellido paterno"
                    aria-label="Apellido paterno" required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />

                <input type="text" name="mother_last_name" placeholder="Apellido materno" aria-label="Apellido materno"
                    required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />


                <input type="email" name="email" autocomplete="email" placeholder="Correo electrónico"
                    aria-label="Correo electrónico" required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />


                <div class="relative w-full">
                    <input type="password" name="password" autocomplete="new-password" placeholder="Contraseña"
                        aria-label="Contraseña" required
                        class="w-full pl-3.5 pr-10 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />

                    <button type="button"
                        class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black focus:outline-none cursor-pointer p-1"
                        aria-label="Mostrar/Ocultar contraseña">
                        <svg class="eye-open w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>

                <!-- 6. Confirm Password with Eye Toggle -->
                <div class="relative w-full">
                    <input type="password" name="confirm_password" autocomplete="new-password"
                        placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" required
                        class="w-full pl-3.5 pr-10 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />

                    <button type="button"
                        class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black focus:outline-none cursor-pointer p-1"
                        aria-label="Mostrar/Ocultar contraseña">
                        <svg class="eye-open w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>

                <button type="submit"
                    class="w-full mt-3 py-2.5 px-5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer tracking-wide">
                    Registrar
                </button>
            </form>
        </div>

        <!-- ============================================== -->
        <!-- 2. DESKTOP REGISTER VIEW (80vw x 86-88vh Split Box) -->
        <!-- ============================================== -->
        <div
            class="hidden md:flex w-full md:w-[80vw] h-[86vh] lg:h-[88vh] bg-[#0A1A32] rounded-3xl shadow-2xl overflow-hidden border border-slate-700/50">

            <!-- Left 60%: desktop login photo with soft corners -->
            <div class="w-[60%] p-4 lg:p-6 flex items-center justify-center overflow-hidden">
                <img src="./src/assets/desktop login photo.jpeg" alt="NorthBase Desktop Register"
                    class="w-full h-full object-cover object-center rounded-2xl lg:rounded-3xl shadow-lg" />
            </div>

            <!-- Right 40%: Register Form (Without ACCOUNT image) -->
            <div class="w-[40%] p-6 lg:p-10 flex flex-col justify-center items-center">
                <div class="w-full max-w-sm flex flex-col items-center">

                    <!-- Registration Form -->
                    <form action="./login.html" method="GET" class="w-full flex flex-col gap-3 lg:gap-3.5">
                        <!-- 1. Name(s) -->
                        <input type="text" name="name" autocomplete="given-name" placeholder="Nombre(s)"
                            aria-label="Nombre(s)" required
                            class="w-full px-4 py-2.5 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-[#C1121F] transition shadow-sm" />

                        <!-- 2. Father's Last Name -->
                        <input type="text" name="father_last_name" autocomplete="family-name"
                            placeholder="Apellido paterno" aria-label="Apellido paterno" required
                            class="w-full px-4 py-2.5 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-[#C1121F] transition shadow-sm" />

                        <!-- 3. Mother's Last Name -->
                        <input type="text" name="mother_last_name" placeholder="Apellido materno"
                            aria-label="Apellido materno" required
                            class="w-full px-4 py-2.5 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-[#C1121F] transition shadow-sm" />

                        <!-- 4. Email -->
                        <input type="email" name="email" autocomplete="email" placeholder="Correo electrónico"
                            aria-label="Correo electrónico" required
                            class="w-full px-4 py-2.5 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-[#C1121F] transition shadow-sm" />

                        <!-- 5. Password with Eye Toggle -->
                        <div class="relative w-full">
                            <input type="password" name="password" autocomplete="new-password" placeholder="Contraseña"
                                aria-label="Contraseña" required
                                class="w-full pl-4 pr-10 py-2.5 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-[#C1121F] transition shadow-sm" />

                            <button type="button"
                                class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black focus:outline-none cursor-pointer p-1"
                                aria-label="Mostrar/Ocultar contraseña">
                                <svg class="eye-open w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                </svg>
                            </button>
                        </div>

                        <!-- 6. Confirm Password with Eye Toggle -->
                        <div class="relative w-full">
                            <input type="password" name="confirm_password" autocomplete="new-password"
                                placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" required
                                class="w-full pl-4 pr-10 py-2.5 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-[#C1121F] transition shadow-sm" />

                            <button type="button"
                                class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black focus:outline-none cursor-pointer p-1"
                                aria-label="Mostrar/Ocultar contraseña">
                                <svg class="eye-open w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                </svg>
                            </button>
                        </div>

                        <!-- Red "Registrar" Button -->
                        <button type="submit"
                            class="w-full mt-2 py-3 px-5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs lg:text-sm rounded-full shadow-md hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer tracking-wide">
                            Registrar
                        </button>
                    </form>

                </div>
            </div>

        </div>

    </main>

    <script src="./src/js/index.js"></script>

</body>

</html>
