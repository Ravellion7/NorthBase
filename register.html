    <style>
        /* Barra deslizante personalizada con la paleta de color azul del header (#0A1A32) */
        #modal-team-tabs::-webkit-scrollbar,
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px !important;
            width: 6px !important;
        }

        #modal-team-tabs::-webkit-scrollbar-button,
        #modal-team-tabs::-webkit-scrollbar-button:single-button,
        #modal-team-tabs::-webkit-scrollbar-button:horizontal:decrement,
        #modal-team-tabs::-webkit-scrollbar-button:horizontal:increment,
        .custom-scrollbar::-webkit-scrollbar-button {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }

        #modal-team-tabs::-webkit-scrollbar-track,
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0A1A32 !important;
            border-radius: 9999px !important;
        }

        #modal-team-tabs::-webkit-scrollbar-thumb,
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e3f70 !important;
            border-radius: 9999px !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
        }

        #modal-team-tabs::-webkit-scrollbar-thumb:hover,
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #2b5797 !important;
        }

        /* Soporte para Firefox */
        @supports not selector(::-webkit-scrollbar) {
            #modal-team-tabs,
            .custom-scrollbar {
                scrollbar-width: thin;
                scrollbar-color: #1e3f70 #0A1A32;
            }
        }
    </style>
</head>

                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                </svg>
                            </button>
                        </div>


                        <div class="relative w-full">
                            <input type="password" name="confirm_password" autocomplete="new-password"
                                placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" required
                                class="w-full pl-4 pr-10 py-2.5 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs lg:text-sm focus:outline-none focus:ring-2 focus:ring-[#C1121F] transition shadow-sm" />

                            <button type="button"
                                class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black focus:outline-none cursor-pointer p-1"
                                aria-label="Mostrar/Ocultar contraseña">
                                <svg class="eye-open w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                </svg>
                            </button>
                        </div>


                        <button type="submit"
                            class="w-full mt-2 py-3 px-5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs lg:text-sm rounded-full shadow-md hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer tracking-wide">
                            Registrar
                        </button>
                    </form>

                </div>
            </div>

        </div>

    </main>

    <!-- Modal para explorar todos los avatares -->
    <div id="avatar-picker-modal"
        class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 select-none opacity-0 transition-opacity duration-200">
        <div
            class="relative w-full max-w-lg bg-[#003049] border-2 border-[#FCBF49]/60 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.85)] p-5 sm:p-6 flex flex-col font-['Poppins',sans-serif] max-h-[92vh] overflow-hidden text-white">

            <!-- Botón Cerrar (X) -->
            <button type="button" id="close-avatar-modal"
                class="absolute top-4 right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center transition-colors cursor-pointer text-sm font-bold z-10"
                aria-label="Cerrar modal">
                ✕
            </button>

            <!-- Encabezado Modal -->
            <div class="text-center mb-3 pr-6 pl-2">
                <h3 class="text-lg sm:text-xl font-bold text-white flex items-center justify-center gap-2">
                    <span>Elige tu Avatar</span>
                </h3>
                <p class="text-xs text-[#669BBC] mt-0.5">
                    Selecciona cualquier avatar oficial de los equipos de la LMB
                </p>
            </div>

            <!-- Pestañas de Equipos con Scroll Horizontal Suave -->
            <div class="mb-3">
                <span class="text-[10px] font-bold uppercase tracking-wider text-[#FCBF49] block mb-1.5 px-1">
                    Equipos:
                </span>
                <div id="modal-team-tabs" class="flex gap-2.5 overflow-x-auto py-2 px-1 custom-scrollbar items-center">
                    <!-- Pestañas insertadas dinámicamente -->
                </div>
            </div>

            <!-- Grid de los 3 avatares del equipo seleccionado en el modal -->
            <div class="flex-1 overflow-y-auto py-2 custom-scrollbar">
                <div class="text-center mb-3">
                    <span id="modal-active-team-name" class="text-sm font-bold text-white tracking-wide"></span>
                </div>
                <div id="modal-avatars-grid" class="grid grid-cols-3 gap-3 sm:gap-4 max-w-sm mx-auto">
                    <!-- 3 avatares renderizados -->
                </div>
            </div>

            <!-- Footer con Vista Previa Actual y Botón Confirmar -->
            <div class="mt-3 pt-3 border-t border-white/10 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <img id="modal-preview-current" src="./src/assets/Profile Pics/Sultanes/sultanes profile pic.jpg"
                        class="w-9 h-9 rounded-full border-2 border-[#FCBF49] object-cover shadow"
                        alt="Avatar seleccionado" />
                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase font-bold tracking-wider text-[#FCBF49]">Seleccionado</span>
                        <span id="modal-selected-avatar-text"
                            class="text-xs text-white/90 font-medium truncate max-w-[170px]">Avatar</span>
                    </div>
                </div>
                <button type="button" id="confirm-avatar-selection-btn"
                    class="px-5 py-2 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-bold text-xs sm:text-sm rounded-full shadow-md hover:scale-105 active:scale-95 transition-all cursor-pointer">
                    Confirmar
                </button>
            </div>

        </div>
    </div>

    <script src="./src/js/index.js"></script>
    <script src="./src/js/auth.js"></script>
    <script src="./src/js/register.js?v=logos"></script>

</body>

</html>
