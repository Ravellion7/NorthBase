<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBase - Landing Page</title>
    <!-- Google Font: Anton -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-white flex flex-col min-h-screen items-center m-0 p-0">
    <!-- 2. Pinned to top (sticky top-0 z-30) and using shadow-xl instead of drop-shadow-xl -->
    <header class="sticky top-0 z-30 w-full bg-[#0A1A32] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- 1. LEFT: Menu Button & Dropdown -->
            <div class="relative">
                <button id="menu-btn"
                    class="flex items-center justify-center p-2 rounded-lg bg-transparent hover:bg-white/10 text-white transition focus:outline-none"
                    aria-label="Abrir Menú">
                    <img src="./src/assets/hamburger menu icon.png" alt="Menu"
                        class="w-6 h-6 sm:w-7 sm:h-7 object-contain" />
                </button>
                <!-- Dropdown Menu -->
                <div id="menu-dropdown"
                    class="hidden absolute left-0 mt-3 w-48 bg-[#0A1A32] border border-white/15 rounded-xl shadow-2xl py-2 z-50 transition-all">
                    <a href="index.html#home"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Home
                    </a>
                    <a href="index.html#nosotros"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Nosotros
                    </a>
                    <a href="index.html#conoce"
                        class="block px-4 py-2.5 text-slate-100 hover:bg-white/10 hover:text-white transition font-medium text-sm">
                        Conoce
                    </a>
                </div>
            </div>
            <!-- CENTER: Upside-Down White Pentagon (retains drop-shadow-xl for polygon) -->
            <div class="absolute left-1/2 -translate-x-1/2 top-0 z-20 drop-shadow-xl">
                <div
                    class="w-20 h-24 sm:w-22 sm:h-26 bg-white flex items-center justify-center pt-1 pb-4 [clip-path:polygon(0_0,100%_0,100%_50%,50%_90%,0_50%)]">
                    <img src="./src/assets/NorthBaseLogo.png" alt="NorthBase Logo"
                        class="w-15 h-15 sm:w-17 sm:h-17 object-contain" />
                </div>
            </div>
            <!-- 3. RIGHT: Spacer -->
            <div class="w-10"></div>
        </div>
    </header>

    <!-- MAIN REGISTER SECTION -->
    <main class="w-full flex-1 flex flex-col items-center justify-start px-4 pt-16 sm:pt-20 pb-16 sm:pb-24">
        <!-- Form Wrapper (More compact overall width: max-w-[290px] sm:max-w-xs) -->
        <div class="w-full max-w-[290px] sm:max-w-xs flex flex-col items-center">

            <!-- 2-Line Title in Poppins -->
            <h1
                class="font-['Poppins',sans-serif] text-2xl sm:text-3xl font-bold text-[#0A1A32] uppercase tracking-wider text-center flex flex-col leading-tight mb-5 drop-shadow-sm">
                <span>CREATE YOUR</span>
                <span>ACCOUNT</span>
            </h1>
            <!-- Registration Form (No labels, tighter gap-2.5) -->
            <form action="#" method="POST" class="w-full flex flex-col gap-4.5 bg-transparent p-0">
                <!-- 1. Name(s) -->
                <input type="text" id="name" name="name" autocomplete="given-name" placeholder="Nombre(s)"
                    aria-label="Nombre(s)" required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
                <!-- 2. Father's Last Name -->
                <input type="text" id="father-last-name" name="father_last_name" autocomplete="family-name"
                    placeholder="Apellido paterno" aria-label="Apellido paterno" required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
                <!-- 3. Mother's Last Name -->
                <input type="text" id="mother-last-name" name="mother_last_name" placeholder="Apellido materno"
                    aria-label="Apellido materno" required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
                <!-- 4. Email -->
                <input type="email" id="email" name="email" autocomplete="email" placeholder="Correo electrónico"
                    aria-label="Correo electrónico" required
                    class="w-full px-3.5 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />
                <!-- 5. Password with Eye Toggle -->
                <div class="relative w-full">
                    <input type="password" id="password" name="password" autocomplete="new-password"
                        placeholder="Contraseña" aria-label="Contraseña" required
                        class="w-full pl-3.5 pr-10 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />

                    <button type="button"
                        class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black focus:outline-none cursor-pointer p-1"
                        aria-label="Mostrar/Ocultar contraseña">
                        <!-- Open Eye Icon -->
                        <svg class="eye-open w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- Slashed Eye Icon (Hidden by default) -->
                        <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>

                <!-- 6. Confirm Password with Eye Toggle -->
                <div class="relative w-full">
                    <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password"
                        placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" required
                        class="w-full pl-3.5 pr-10 py-2 bg-white border-2 border-black border-b-4 rounded-xl text-slate-900 placeholder-slate-400 font-['Poppins',sans-serif] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-black transition shadow-sm" />

                    <button type="button"
                        class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black focus:outline-none cursor-pointer p-1"
                        aria-label="Mostrar/Ocultar contraseña">
                        <!-- Open Eye Icon -->
                        <svg class="eye-open w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- Slashed Eye Icon (Hidden by default) -->
                        <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>

                <button type="submit"
                    class="w-full mt-2 py-2.5 px-5 bg-[#C1121F] hover:bg-[#9b0e19] text-white font-['Poppins',sans-serif] font-bold text-xs sm:text-sm rounded-full shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer tracking-wide mt-5">
                    Registrar
                </button>
            </form>
        </div>
    </main>

    <script src="./src/js/index.js"></script>

</body>

</html>
